{{- if and .Values.enabled .Values.valkey.enabled .Values.externalSecrets.enabled }}
# Mints the Valkey password once in-cluster (ESO Password generator) and
# populates the `valkey` Secret with the `valkey-password` key. Consumed by:
#   - Bitnami valkey subchart (auth.existingSecret: valkey)
#   - hapihub Deployment (env VALKEY_PASSWORD from same secret/key)
#   - cadence Deployment (env VALKEY_PASSWORD from same secret/key)
#
# ponytail: no KV entry required — the identity never leaves the cluster.
# Mycure pulls it from GCP Secret Manager instead; we match s3proxy's
# in-cluster mint pattern here. Rotate by deleting this generator + the
# target Secret and letting ESO re-mint.
#
# refreshInterval: "0" pins the password — ESO won't re-invoke the
# generator on reconcile (default behaviour would rotate it on every
# sync and break both hapihub and cadence).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ include "hapihub.fullname" . }}-valkey-password
  namespace: {{ include "hapihub.namespace" . }}
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: cache
spec:
  length: 32
  digits: 5
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: valkey
  namespace: {{ include "hapihub.namespace" . }}
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: cache
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore | default "azure-secretstore" }}
    kind: {{ .Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
  target:
    name: valkey
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        valkey-password: {{ `"{{ .password }}"` }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "hapihub.fullname" . }}-valkey-password
{{- end }}
