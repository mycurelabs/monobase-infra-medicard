# Kyverno Resources Configuration
# Policy enforcement rules for security and compliance

# Policies are deployed cluster-wide (no namespace needed)

# Enable/disable specific policies
policies:
  # Pod Security Standards (Restricted Profile)
  podSecurity:
    enabled: true
    validationFailureAction: enforce  # or "audit" for testing

  # Require Standard Labels
  requireLabels:
    enabled: true
    validationFailureAction: enforce  # or "audit"

  # Restrict Image Registries
  restrictRegistries:
    enabled: true
    validationFailureAction: audit  # Start with audit, move to enforce later

    # Approved container registries
    # Add new registries here as needed
    allowedRegistries:
      # Your organization
      - "ghcr.io/monobaselabs/*"

      # Organization
      - "ghcr.io/mycurelabs/*"

      # Trusted third-party registries
      - "bitnami/*"
      - "docker.io/bitnamilegacy/*"
      - "registry.k8s.io/*"
      - "k8s.gcr.io/*"

      # AKS-injected / Azure-managed images
      - "mcr.microsoft.com/*"

      # Monitoring / logging
      - "docker.io/grafana/*"
      - "docker.io/prom/*"
      - "quay.io/prometheus/*"
      - "quay.io/prometheus-operator/*"
      - "kiwigrid/*"

      # Cert-manager
      - "quay.io/jetstack/*"

      # Security tools
      - "docker.io/falcosecurity/*"
      - "ghcr.io/kyverno/*"

      # External Secrets + Dex
      - "ghcr.io/external-secrets/*"
      - "ghcr.io/dexidp/*"

      # Envoy Gateway
      - "envoyproxy/*"
      - "docker.io/envoyproxy/*"

      # PostgreSQL
      - "docker.io/bitnami/postgresql*"

      # Storage: s3proxy (Docker Hub direct), Velero
      - "andrewgaul/*"
      - "docker.io/velero/*"

      # Valkey (Redis)
      - "docker.io/valkey/*"
      - "docker.io/bitnami/valkey*"

      # MinIO
      - "quay.io/minio/*"
      - "docker.io/minio/*"

      # Velero
      - "velero/*"
      - "gcr.io/velero-gcp/*"

      # ArgoCD
      - "quay.io/argoproj/*"
