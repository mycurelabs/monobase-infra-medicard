{{- if and .Values.enabled .Values.externalSecrets.enabled .Values.externalSecrets.secrets }}
# Syncs the migrator's source/target/encryption secrets from the backing
# store into the k8s Secret the Deployment mounts via secretKeyRef
# (.Values.migration.existingSecret). Target name is pinned to that same
# value so the two always line up.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.migration.existingSecret }}
  namespace: {{ include "hapihub-migrator.namespace" . }}
  labels:
    {{- include "hapihub-migrator.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore | default (printf "%s-secretstore" (include "hapihub-migrator.namespace" .)) }}
    kind: {{ .Values.externalSecrets.secretStoreKind | default "SecretStore" }}
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  target:
    name: {{ .Values.migration.existingSecret }}
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecrets.secrets }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
        {{- if .property }}
        property: {{ .property }}
        {{- end }}
    {{- end }}
{{- end }}
