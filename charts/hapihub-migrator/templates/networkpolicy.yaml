{{- if and .Values.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hapihub-migrator.fullname" . }}
  namespace: {{ include "hapihub-migrator.namespace" . }}
  labels:
    {{- include "hapihub-migrator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hapihub-migrator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow from Gateway
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gateway.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.networkPolicy.gateway.name }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}

  egress:
    # DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53

    # PostgreSQL (external Azure + in-cluster)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432

    # MongoDB Atlas (external)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 27016
        - protocol: TCP
          port: 27017

    # HTTPS egress (Tailwind CDN, Atlas SRV resolution)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443

    {{- if .Values.storage.enabled }}
    # GridFS → S3 storage migration: reach the in-cluster S3 endpoint
    # (e.g. s3proxy). namespaceSelector:{} keeps it simple across ns layouts.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.storage.endpointPort | default 9000 }}
    {{- end }}
{{- end }}
