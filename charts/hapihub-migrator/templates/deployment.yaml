{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hapihub-migrator.fullname" . }}
  namespace: {{ include "hapihub-migrator.namespace" . }}
  labels:
    {{- include "hapihub-migrator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hapihub-migrator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "hapihub-migrator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hapihub-migrator.serviceAccountName" . }}
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.livenessProbe.httpGet.path }}
            port: {{ .Values.livenessProbe.httpGet.port | default "http" }}
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
        {{- end }}
        {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          httpGet:
            path: {{ .Values.readinessProbe.httpGet.path }}
            port: {{ .Values.readinessProbe.httpGet.port | default "http" }}
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        env:
        - name: NODE_ENV
          value: "production"
        - name: HOME
          value: "/tmp"
        - name: HTTP_PORT
          value: {{ .Values.service.targetPort | quote }}
        - name: MODE
          value: {{ .Values.migration.mode | quote }}
        - name: BATCH_SIZE
          value: {{ .Values.migration.batchSize | default "1000" | quote }}
        - name: COLLECTION_CONCURRENCY
          value: {{ .Values.migration.collectionConcurrency | default "4" | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.migration.logLevel | default "info" | quote }}
        - name: MAX_ERROR_RATE
          value: {{ .Values.migration.maxErrorRate | default "0.01" | quote }}
        - name: RESUME_MIGRATION
          value: "true"
        - name: EXIT_ON_BULK_END
          value: {{ .Values.migration.exitOnBulkEnd | default "false" | quote }}
        {{- if .Values.migration.migrationTimestamp }}
        - name: MIGRATION_TIMESTAMP
          value: {{ .Values.migration.migrationTimestamp | quote }}
        {{- end }}
        {{- if .Values.migration.timestampStrategy }}
        - name: TIMESTAMP_STRATEGY
          value: {{ .Values.migration.timestampStrategy | quote }}
        {{- end }}
        - name: MONGO_SOURCE_URI
          valueFrom:
            secretKeyRef:
              name: {{ .Values.migration.existingSecret }}
              key: mongo-source-uri
        {{- if .Values.postgresql.uriSecret }}
        - name: PG_TARGET_URI
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.uriSecret.name }}
              key: {{ .Values.postgresql.uriSecret.key }}
        {{- else }}
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgresql.existingSecret }}
              key: {{ .Values.postgresql.secretKey }}
        - name: PG_TARGET_URI
          value: "postgresql://{{ .Values.postgresql.username }}:$(POSTGRESQL_PASSWORD)@{{ include "hapihub-migrator.postgresql.host" . }}:{{ .Values.postgresql.port }}/{{ .Values.postgresql.database }}"
        {{- end }}
        - name: ENC_PERSONAL_DETAILS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.migration.existingSecret }}
              key: enc-personal-details
              optional: true
        - name: ENC_MEDICAL_RECORDS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.migration.existingSecret }}
              key: enc-medical-records
              optional: true
        - name: ENC_BILLING_INVOICES
          valueFrom:
            secretKeyRef:
              name: {{ .Values.migration.existingSecret }}
              key: enc-billing-invoices
              optional: true
        - name: PG_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.migration.existingSecret }}
              key: pg-encryption-key
              optional: true
        - name: ENC_BILLING_ITEMS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.migration.existingSecret }}
              key: enc-billing-items
              optional: true
        - name: ENC_BILLING_PAYMENTS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.migration.existingSecret }}
              key: enc-billing-payments
              optional: true
        {{- if .Values.cdc.enabled }}
        {{- with .Values.cdc }}
        {{- if .changelogCollectionPrefix }}
        - name: CDC_CHANGELOG_COLLECTION_PREFIX
          value: {{ .changelogCollectionPrefix | quote }}
        {{- end }}
        {{- if .replayBatchSize }}
        - name: CDC_REPLAY_BATCH_SIZE
          value: {{ .replayBatchSize | quote }}
        {{- end }}
        {{- if .replayIntervalMs }}
        - name: CDC_REPLAY_INTERVAL_MS
          value: {{ .replayIntervalMs | quote }}
        {{- end }}
        {{- end }}
        {{- end }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      {{- $nodePool := include "hapihub-migrator.nodePool" . -}}
      {{- if or $nodePool .Values.nodeSelector }}
      nodeSelector:
        {{- if $nodePool }}
        node-pool: {{ $nodePool }}
        {{- end }}
        {{- with .Values.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $nodePool .Values.tolerations }}
      tolerations:
        {{- if $nodePool }}
        - key: "node-pool"
          operator: "Equal"
          value: {{ $nodePool | quote }}
          effect: "NoSchedule"
        {{- end }}
        {{- with .Values.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
