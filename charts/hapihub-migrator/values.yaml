# Default values for hapihub-migrator chart

global:
  domain: example.com
  namespace: example-prod
  environment: production
  gateway:
    name: shared-gateway
    namespace: gateway-system

enabled: true

replicaCount: 1

image:
  repository: ghcr.io/mycurelabs/hapihub-migrator
  pullPolicy: IfNotPresent
  tag: "3.0.3"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false  # Bun needs tmp write access

service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  annotations: {}

gateway:
  enabled: false
  hostname: ""
  listener: https

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}

# ExternalSecret: sync source/target/encryption secrets from the backing
# store into `migration.existingSecret`. Off by default; per-deployment
# values (e.g. values/deployments/medicard.yaml) turn it on and supply the
# store + remoteKey mappings.
externalSecrets:
  enabled: false
  secretStore: ""
  secretStoreKind: SecretStore
  refreshInterval: 1h
  secrets: []

# Dashboard: long-lived read-only monitoring UI (MODE=dashboard). Serves the
# SSR dashboard + status/verify/audit from PG. Never touches the Mongo source.
dashboard:
  enabled: true
  replicaCount: 1
  # resources: {}   # falls back to top-level .resources if unset

# Migration workload: a SUSPENDED CronJob (see cronjob.yaml). ArgoCD manages it
# but it never auto-fires; operators trigger a run via `kubectl create job --from`.
migrationJob:
  enabled: true
  suspend: true
  schedule: "0 0 31 2 *"   # Feb 31 = never; the CronJob exists only as a template
  backoffLimit: 0          # a failed migration must not silently retry
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # activeDeadlineSeconds: 86400
  # resources: {}          # falls back to top-level .resources if unset

# Migration configuration (consumed by the CronJob's pod template)
migration:
  mode: "bulk"
  batchSize: "1000"
  collectionConcurrency: "4"
  logLevel: "info"
  maxErrorRate: "0.01"
  resume: "true"           # RESUME_MIGRATION — resume the latest in-progress run
  # runId: ""              # pin RUN_ID for a deterministic converging run
  # startCollectorInBulk: false  # only true if a CDC deployment will follow
  # bulkCutoffDate: ""     # ISO8601; pin for determinism across restarts
  # collections: ""        # comma-separated filter
  existingSecret: "hapihub-migration-secrets"

# GridFS → S3 storage migration. Off by default; when enabled the migration
# CronJob downloads GridFS files and uploads them to the S3 target (endpoint),
# then points the PG storage_files rows at the new keys.
storage:
  enabled: false
  bucket: ""
  endpoint: ""            # e.g. http://s3proxy:9000
  region: "us-east-1"
  directory: "files"
  secretName: ""          # secret holding the S3 access key id + secret
  accessKeyIdKey: "root-user"
  secretAccessKeyKey: "root-password"

# CDC (Change Data Capture) configuration
cdc:
  enabled: false
  # changelogCollectionPrefix: "_changelog"
  # replayBatchSize: "500"
  # replayIntervalMs: "1000"

# PostgreSQL connection (default: in-cluster, constructed from parts)
postgresql:
  host: "postgresql"
  port: "5432"
  database: "postgres"
  username: "postgres"
  existingSecret: "postgresql"
  secretKey: "postgres-password"
  # Override with full URI from a secret (for external PG):
  # uriSecret:
  #   name: "hapihub-migration-secrets"
  #   key: "pg-target-uri"

networkPolicy:
  enabled: true
  gateway:
    namespace: envoy-gateway-system
    name: envoy-gateway
