{{- if and .Values.velero.enabled (eq .Values.velero.provider "azure") }}
# Builds the velero-credentials secret (key `cloud`, dotenv format read by
# velero-plugin-for-microsoft-azure) from the SAME Key Vault entry s3proxy
# uses for its Azure Blob shared key — no dedicated backup identity, no new
# KV entries. The BSL points at this via storageAccountKeyEnvVar.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: velero-credentials
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: {{ .Values.velero.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.velero.externalSecrets.secretStore | default "azure-secretstore" }}
    kind: ClusterSecretStore
  target:
    name: velero-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        cloud: |
          AZURE_STORAGE_ACCOUNT_ACCESS_KEY={{ `{{ .azureKey }}` }}
          AZURE_CLOUD_NAME=AzurePublicCloud
  data:
    - secretKey: azureKey
      remoteRef:
        key: {{ .Values.velero.externalSecrets.azureBlobKeyKey | required "velero.externalSecrets.azureBlobKeyKey is required" }}
{{- end }}
