# Velero Resources Configuration
# BackupStorageLocations and Backup Schedules

# Velero configuration
velero:
  enabled: true

  # Cloud provider: aws, azure, gcp, or digitalocean
  provider: aws

  # AWS configuration
  aws:
    region: us-east-1
    bucket: ""  # S3 bucket name (required)

  # Azure configuration (storage-account-key auth — no identity;
  # key synced from Key Vault via velero-credentials-externalsecret.yaml)
  azure:
    storageAccount: ""
    blobContainer: ""

  # ExternalSecret source for velero-credentials (azure provider only).
  # Reuses the SAME Key Vault entry s3proxy uses for its Azure Blob key.
  externalSecrets:
    secretStore: azure-secretstore
    refreshInterval: 1h
    azureBlobKeyKey: ""  # e.g. medicard-prod-azureblob-account-key (required)

  # GCP configuration
  gcp:
    bucket: ""
    project: ""

  # DigitalOcean configuration
  digitalocean:
    bucket: ""
    region: nyc3

  # Backup schedules (keys are what templates/schedules.yaml actually reads:
  # `retention`, not the old dead `ttl` keys)
  schedules:
    infrastructure:
      hourly:
        enabled: false
        schedule: "0 * * * *"  # Every hour
        retention: 72h  # 3 days
      daily:
        enabled: true
        schedule: "0 3 * * *"  # 3 AM daily
        retention: 720h  # 30 days

    # Cluster resources backup (weekly)
    cluster:
      weekly:
        enabled: true
        schedule: "0 4 * * 0"  # 4 AM Sunday
        retention: 2160h  # 90 days

# Kyverno policy engine (for policy enforcement)
kyverno:
  enabled: false

# Falco runtime security (for rule enforcement)
falco:
  enabled: false
