apiVersion: v2
name: grafana
description: Grafana monitoring visualization with Gateway API integration
type: application
version: 1.0.0
appVersion: "11.x.x"
keywords:
  - monitoring
  - grafana
  - prometheus
  - visualization
home: https://github.com/monobaselabs/monobase-infra
sources:
  - https://github.com/grafana/grafana
maintainers:
  - name: Monobase
    email: hello@monobase.com

dependencies:
  - name: grafana
    version: "~11.3.0"
    repository: https://charts.bitnami.com/bitnami
    condition: enabled
  # In-cluster PostgreSQL for Grafana's session/dashboard metadata.
  # Bitnami PG standalone; enabled when Grafana runs multi-replica (a
  # single-replica Grafana can use SQLite instead). Bitnamilegacy image
  # (see charts/grafana/values.yaml `postgresql.image`) sidesteps the
  # Bitnami public-image migration.
  - name: postgresql
    version: "~15.5.0"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
