{{- if and .Values.enabled .Values.postgresql.enabled .Values.externalSecrets.enabled }}
# ESO Password generator + ExternalSecret. Mints one 32-char password
# in-cluster, pins it (refreshInterval: "0"), and populates the Secret
# named `grafana-postgresql-secret` with both `postgres-password`
# (Bitnami PG superuser) and `password` (Grafana app user) so both
# roles resolve to the same value — Grafana uses the app user, admin
# operations use the superuser.
#
# ponytail: no KV entry required — this credential never leaves the
# monitoring namespace. Rotate by deleting this ExternalSecret + the
# target Secret + the Password generator; ESO re-mints on next reconcile.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: grafana-postgresql-password
  namespace: {{ .Values.global.namespace | default "monitoring" }}
  labels:
    app.kubernetes.io/name: grafana-postgresql
    app.kubernetes.io/component: grafana
spec:
  length: 32
  digits: 5
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-postgresql-secret
  namespace: {{ .Values.global.namespace | default "monitoring" }}
  labels:
    app.kubernetes.io/name: grafana-postgresql
    app.kubernetes.io/component: grafana
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore | default "azure-secretstore" }}
    kind: {{ .Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
  target:
    name: grafana-postgresql-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        postgres-password: {{ `"{{ .password }}"` }}
        password: {{ `"{{ .password }}"` }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: grafana-postgresql-password
{{- end }}
