# Default values for Grafana chart wrapper
# Override these values in deployment-specific values files

# Global configuration (shared across charts)
global:
  domain: example.com
  namespace: monitoring
  environment: production
  gateway:
    name: shared-gateway
    namespace: gateway-system

enabled: false  # Master enable/disable for both Grafana and HTTPRoute

nameOverride: ""
fullnameOverride: ""

# ===== Official Bitnami Grafana Chart Values =====
# Passed through to Bitnami grafana subchart
# See https://github.com/bitnami/charts/tree/main/bitnami/grafana
# IMPORTANT: Values must be nested under 'grafana:' to be passed to the subchart

grafana:
  # Admin credentials
  admin:
    user: admin
    password: admin  # Change via External Secrets in production

  # Auto-provisioned datasources.
  # Prometheus: the metrics store (kube-prometheus-stack service in the
  # monitoring namespace).
  # Loki: the logs store (grafana/loki chart in single-binary mode; service
  # name is `loki` in the same monitoring namespace, port 3100). Wiring
  # this here lets ops query logs from the same Grafana UI as metrics —
  # required for Falco alert investigation (Falco → stdout → Promtail →
  # Loki → Grafana Explore).
  datasources:
    secretDefinition:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
          isDefault: true
          editable: true
          jsonData:
            timeInterval: 30s
        - name: Loki
          type: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100
          isDefault: false
          editable: true
          jsonData:
            maxLines: 1000

  # Resource configuration (minimal for staging)
  resources:
    requests:
      cpu: "50m"
      memory: "150Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  # Persistence
  persistence:
    enabled: true
    storageClass: ""  # Use cluster default
    size: "10Gi"

  # Security context
  securityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001

  # Use bitnamilegacy image (consistency with monitoring stack)
  image:
    registry: docker.io
    repository: bitnamilegacy/grafana

  # Dashboard provider configuration
  dashboardsProvider:
    enabled: true

  # Dashboard ConfigMaps to load
  dashboardsConfigMaps:
    - configMapName: grafana-dashboard-global
      fileName: global.json
    - configMapName: grafana-dashboard-nodes
      fileName: nodes.json
    - configMapName: grafana-dashboard-namespaces
      fileName: namespaces.json
    - configMapName: grafana-dashboard-pods
      fileName: pods.json
    - configMapName: grafana-dashboard-apiserver
      fileName: api-server.json
    - configMapName: grafana-dashboard-prometheus
      fileName: prometheus.json

# ===== In-cluster PostgreSQL (subchart) =====
# Backs Grafana's dashboard / user / session metadata so multiple Grafana
# replicas share one source of truth. Single-replica PG (Grafana keeps
# serving cached content on PG blip); PG HA is future work.
#
# When postgresql.enabled=false (default), Grafana falls back to the
# per-pod SQLite backend and MUST run at replicas=1.
postgresql:
  enabled: false

  # Bitnami migrated public images to bitnamilegacy/* in mid-2025; the
  # rest of this repo pins the same tag/registry (see Kyverno allowlist).
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: "16.4.0-debian-12-r13"

  architecture: standalone

  auth:
    enabled: true
    database: grafana
    username: grafana
    # Password minted by ESO Password generator; see
    # charts/grafana/templates/postgresql-externalsecret.yaml.
    existingSecret: grafana-postgresql-secret
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password

  primary:
    persistence:
      enabled: true
      storageClass: ""
      size: "10Gi"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

# ===== ExternalSecret / Password generator config =====
# Applies only when postgresql.enabled=true. Password is minted once in
# the cluster (no KV entry) and pinned via refreshInterval="0" so it
# doesn't rotate on every ESO reconcile.
externalSecrets:
  enabled: false
  secretStore: azure-secretstore
  secretStoreKind: ClusterSecretStore

# ===== Custom Gateway API Configuration =====
gateway:
  enabled: true
  hostname: ""  # Empty = uses grafana.{global.domain}
  parentRefs:
    - name: shared-gateway
      namespace: gateway-system

  # Optional: Rate limiting for Grafana web UI
  rateLimit:
    enabled: false
    perIP:
      requests: 100
      unit: Minute
    burst:
      requests: 500
      unit: Hour
