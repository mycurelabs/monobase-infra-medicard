{{- if and .Values.enabled .Values.externalSecrets.enabled }}
# Mints the s3proxy S3-side credential once, in-cluster. Consumed by the
# ExternalSecret in externalsecret.yaml via dataFrom.sourceRef.generatorRef.
# ponytail: no MediCard KV entry needed — this identity never leaves the
# cluster. Rotate by deleting this resource + the target Secret, then
# letting ESO re-mint.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ include "s3proxy.fullname" . }}-s3cred
  namespace: {{ include "s3proxy.namespace" . }}
  labels:
    {{- include "s3proxy.labels" . | nindent 4 }}
spec:
  length: 32
  digits: 5
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
{{- end }}
