{{- if and .Values.enabled .Values.externalSecrets.enabled }}
# Creates the k8s Secret named `minio` (via fullnameOverride) with the four
# keys s3proxy + hapihub both read:
#   root-user, root-password    (S3 identity — generated once, KV-backed)
#   azureblob-account,
#   azureblob-key               (Azure Blob shared key — from MediCard KV)
#
# ponytail: root-user is the s3Identity value (not a secret — usernames
# aren't). root-password is the sole secret we generate; hapihub uses the
# same values as its STORAGE_S3_ACCESS_KEY_ID/STORAGE_S3_SECRET_ACCESS_KEY
# because the Secret name and keys match what hapihub's chart hardcodes.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "s3proxy.fullname" . }}-credentials
  namespace: {{ include "s3proxy.namespace" . }}
  labels:
    {{- include "s3proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-secrets
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore | default "azure-secretstore" }}
    kind: {{ .Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
  target:
    name: {{ include "s3proxy.fullname" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        root-user: {{ .Values.s3Identity | quote }}
        root-password: {{ `"{{ .s3Credential }}"` }}
        azureblob-account: {{ `"{{ .azureAccount }}"` }}
        azureblob-key: {{ `"{{ .azureKey }}"` }}
  data:
    - secretKey: azureAccount
      remoteRef:
        key: {{ .Values.externalSecrets.azureAccountKey | required "externalSecrets.azureAccountKey is required" }}
    - secretKey: azureKey
      remoteRef:
        key: {{ .Values.externalSecrets.azureBlobKeyKey | required "externalSecrets.azureBlobKeyKey is required" }}
    - secretKey: s3Credential
      remoteRef:
        # ponytail: single value we populate once with a random 32-char
        # password; no rotation required (internal-to-cluster identity).
        key: {{ .Values.externalSecrets.s3CredentialKey | required "externalSecrets.s3CredentialKey is required" }}
{{- end }}
