{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "s3proxy.fullname" . }}
  namespace: {{ include "s3proxy.namespace" . }}
  labels:
    {{- include "s3proxy.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.port }}
      targetPort: s3
      protocol: TCP
      name: s3
  selector:
    {{- include "s3proxy.selectorLabels" . | nindent 4 }}
{{- end }}
