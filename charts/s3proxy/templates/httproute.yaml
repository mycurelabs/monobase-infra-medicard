{{- if and .Values.enabled .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "s3proxy.fullname" . }}
  namespace: {{ include "s3proxy.namespace" . }}
  labels:
    {{- include "s3proxy.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "s3proxy.gateway.name" . }}
      namespace: {{ include "s3proxy.gateway.namespace" . }}
      sectionName: {{ .Values.gateway.listener | default "http" }}
  hostnames:
    - {{ include "s3proxy.gateway.hostname" . }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "s3proxy.fullname" . }}
          port: {{ .Values.port }}
          weight: 1
{{- end }}
