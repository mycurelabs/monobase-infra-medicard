{{- if .Values.falco.enabled }}
# ArgoCD Application: Falco
# Sync Wave 0 - Deploy runtime security monitoring (cluster-wide)
# Only deployed if falco.enabled=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    chart: falco
    repoURL: https://falcosecurity.github.io/charts
    targetRevision: {{ .Values.falco.version | default "9.1.0" }}
    helm:
      releaseName: falco
      valuesObject:
        # Pin the driver explicitly (chart 9.x defaults to `auto` which
        # picks modern_ebpf on 5.8+ kernels — AKS is on 6.8 — but pinning
        # avoids surprises if the auto-selection heuristic changes).
        # modern_ebpf is CO-RE / no kernel-module build required.
        driver:
          kind: modern_ebpf

  destination:
    server: https://kubernetes.default.svc
    namespace: falco

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 3m
{{- end }}
