{{- if .Values.argocd.notifications.slack.enabled }}
# Populates the k8s Secret `argocd-notifications-secret` that the ArgoCD
# Notifications Controller reads for token substitutions in notification
# templates. The `$slack-token` reference in argocd.notifications.notifiers
# resolves to the `slack-token` key on this secret.
#
# ExternalSecrets Operator pulls the actual Slack bot token / incoming-webhook
# URL from Azure Key Vault under the name in argocd.notifications.slack.externalSecretKey.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-notifications-secret
    app.kubernetes.io/component: argocd
spec:
  refreshInterval: {{ .Values.argocd.notifications.slack.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.argocd.notifications.slack.secretStore | default "azure-secretstore" }}
    kind: ClusterSecretStore
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        slack-token: {{ `"{{ .token }}"` }}
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.argocd.notifications.slack.externalSecretKey | required "argocd.notifications.slack.externalSecretKey is required" }}
{{- end }}
