{{- if .Values.gateway.enabled }}
---
# ArgoCD Application: Envoy Gateway (Operator)
# Sync Wave 0 - Deploy gateway infrastructure (cluster-wide)

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    chart: gateway-helm
    repoURL: docker.io/envoyproxy
    targetRevision: {{ .Values.gateway.operator.version | default "v1.2.0" }}
    helm:
      releaseName: envoy-gateway
      skipCrds: false  # Install Gateway API CRDs (required for fresh clusters)
      valuesObject:
        certgen:
          job:
            annotations:
              argocd.argoproj.io/hook: PreSync
              argocd.argoproj.io/hook-delete-policy: HookSucceeded
        # Envoy Gateway CONTROLLER HA. This is the operator that watches
        # Gateway/HTTPRoute CRs and reconciles Envoy configs — separate
        # from the data-plane Deployment (envoy-gateway-system-shared-
        # gateway-*), which is scaled via the EnvoyProxy CR in
        # charts/envoy-proxy-config.
        deployment:
          replicas: {{ .Values.gateway.operator.replicas | default 1 }}
          pod:
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/name: gateway-helm
                      topologyKey: kubernetes.io/hostname

  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m
---
# ArgoCD Application: Gateway Resources
# Deploys the shared Gateway resource after Envoy Gateway operator is ready
# Sync Wave 1 - Deployed after Envoy Gateway operator (wave 0)

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-resources
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"  # After envoy-gateway operator
  labels:
    app.kubernetes.io/name: gateway-resources
    app.kubernetes.io/component: infrastructure
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: {{ .Values.argocd.repoURL }}
    targetRevision: {{ .Values.argocd.targetRevision }}
    path: charts/gateway
    helm:
      releaseName: gateway
      valuesObject:
        {{- toYaml .Values.gateway | nindent 8 }}

  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-system

  syncPolicy:
    automated:
      prune: true       # Remove resources if removed from Git
      selfHeal: true    # Auto-correct configuration drift
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true  # Better for CRDs
      - RespectIgnoreDifferences=true  # Respect ignoreDifferences during sync
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  # Ignore expected differences
  ignoreDifferences:
    # Gateway status is managed by controller
    - group: gateway.networking.k8s.io
      kind: Gateway
      jsonPointers:
        - /status
    # HTTPRoute status is managed by controller
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jsonPointers:
        - /status
        - /spec/parentRefs  # Ignore K8s auto-added group/kind fields
        - /spec/rules/0/matches  # Ignore auto-added default matches
    # Certificate status is managed by cert-manager
    - group: cert-manager.io
      kind: Certificate
      jsonPointers:
        - /status
{{- end }}
