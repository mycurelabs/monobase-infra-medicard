{{- if .Values.valkey.enabled }}
# ArgoCD Application: Valkey (Redis Cache)
# Sync Wave 2 - Deploy cache before applications

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.global.namespace }}-valkey
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    chart: valkey
    repoURL: https://charts.bitnami.com/bitnami
    # `2.x.x` isn't a valid `helm pull --version` spec. Chart 2.2.1 is
    # the last release shipping valkey 8.0.1 (matches the image tag in
    # medicard's values). Chart 3.0+ moved to valkey 9.x default; bumping
    # a major would need re-audit of the subchart values.
    targetRevision: {{ .Values.valkey.chartVersion | default "2.2.1" }}
    helm:
      releaseName: valkey
      valuesObject:
        image:
          repository: {{ .Values.valkey.image.repository | default "bitnamilegacy/valkey" }}
          tag: {{ .Values.valkey.image.tag | default "8.0.1-debian-12-r2" }}
        architecture: {{ .Values.valkey.architecture | default "standalone" }}
        master:
          persistence:
            enabled: {{ .Values.valkey.master.persistence.enabled | default false }}
            storageClass: {{ .Values.valkey.master.persistence.storageClass | default "" }}
            size: {{ .Values.valkey.master.persistence.size | default "8Gi" }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.global.namespace }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 5m
{{- end }}
