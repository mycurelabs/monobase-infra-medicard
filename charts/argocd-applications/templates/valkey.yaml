{{- if .Values.valkey.enabled }}
# ArgoCD Application: Valkey (Redis Cache)
# Sync Wave 2 - Deploy cache before applications

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.global.namespace }}-valkey
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # Bitnami moved to OCI-only distribution in 2025; the legacy HTTPS
    # repo URL returns "invalid_reference: invalid tag" for newer charts.
    chart: valkey
    repoURL: registry-1.docker.io/bitnamicharts
    # Chart 2.2.1 is the last release shipping valkey 8.0.1 (matches the
    # image tag in medicard's values). Chart 3.0+ moved to valkey 9.x
    # default; bumping a major would need re-audit of the subchart values.
    targetRevision: {{ .Values.valkey.chartVersion | default "2.2.1" }}
    helm:
      releaseName: valkey
      valuesObject:
        # `global.security.allowInsecureImages: true` is required so the
        # chart accepts the bitnamilegacy image (Bitnami's chart 2.2.1
        # verifies the image registry/repository and refuses non-original
        # tags otherwise). Mirrors what mycure prod does.
        {{- if .Values.valkey.global }}
        global:
          {{- toYaml .Values.valkey.global | nindent 10 }}
        {{- else }}
        global:
          security:
            allowInsecureImages: true
        {{- end }}
        image:
          repository: {{ .Values.valkey.image.repository | default "bitnamilegacy/valkey" }}
          tag: {{ .Values.valkey.image.tag | default "8.0.1-debian-12-r2" }}
        architecture: {{ .Values.valkey.architecture | default "standalone" }}
        {{- if .Values.valkey.auth }}
        auth:
          enabled: true
          existingSecret: {{ .Values.valkey.auth.existingSecret | default "valkey" }}
        {{- end }}
        # Bitnami's chart 2.x uses `primary:` (not `master:`) for standalone
        # architecture — align with the new key. `master:` in medicard values
        # is kept for readability + parity with mycure's older naming.
        primary:
          persistence:
            enabled: {{ .Values.valkey.master.persistence.enabled | default false }}
            storageClass: {{ .Values.valkey.master.persistence.storageClass | default "" }}
            size: {{ .Values.valkey.master.persistence.size | default "8Gi" }}
          {{- if .Values.valkey.master.resources }}
          resourcesPreset: "none"
          resources:
            {{- toYaml .Values.valkey.master.resources | nindent 12 }}
          {{- end }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.global.namespace }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 5m
{{- end }}
