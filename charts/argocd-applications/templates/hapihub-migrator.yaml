{{- if .Values.hapihubMigrator.enabled }}
# ArgoCD Application: HapiHub Migrator (MongoDB → PostgreSQL)
# Sync Wave 4 - Deploy after database (wave 2) is ready

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.global.namespace }}-hapihub-migrator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: {{ .Values.argocd.repoURL }}
    targetRevision: {{ .Values.argocd.targetRevision | default "HEAD" }}
    path: charts/hapihub-migrator
    helm:
      releaseName: hapihub-migrator
      valuesObject:
        global:
          {{- .Values.global | toYaml | nindent 10 }}
        {{- omit .Values.hapihubMigrator "enabled" | toYaml | nindent 8 }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.global.namespace }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 5m
{{- end }}
