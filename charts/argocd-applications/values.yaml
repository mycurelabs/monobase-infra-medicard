# Default values for monobase-applications Helm chart
# These are overridden by deployments/*/values.yaml files
# Note: argocd.repoURL is injected from ApplicationSet bootstrap file

global:
  domain: example.com
  namespace: example
  environment: production

# Default: s3proxy off unless a deployment file opts in. Keeps templates/s3proxy.yaml
# safe for deployment files that don't declare an `s3proxy:` block.
s3proxy:
  enabled: false
