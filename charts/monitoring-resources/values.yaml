# Monitoring Resources Configuration
# Grafana Dashboards, Prometheus Rules, and ServiceMonitors

# Global namespace for monitoring resources
# Typically "monitoring" but can be customized
namespace: monitoring

# Grafana Dashboards
dashboards:
  enabled: true
  # Enable/disable specific dashboards
  readme:
    enabled: true
  cluster:
    enabled: true
  api:
    enabled: true
  database:
    enabled: true

# Prometheus Rules (Alerts)
rules:
  enabled: true
  # Alert severity levels
  critical:
    enabled: true
  warning:
    enabled: true

# Alertmanager receiver configuration.
# Alertmanager itself is enabled in values/infrastructure/main.yaml; this
# block wires WHERE alerts go. Flip .slack.enabled to true AFTER writing
# a Slack incoming-webhook URL to the KV entry named in externalSecretKey
# — the ExternalSecret + AlertmanagerConfig CR come up together.
alertmanager:
  slack:
    enabled: false
    channel: "#medicard-prod-alerts"
    externalSecretKey: medicard-prod-alertmanager-slack-webhook
    secretStore: azure-secretstore
    refreshInterval: 1h

# ServiceMonitors
serviceMonitors:
  enabled: true
  # Which services to monitor
  api:
    enabled: true
  postgresql:
    enabled: true
  gateway:
    enabled: true
