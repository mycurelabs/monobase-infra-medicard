{{- if .Values.alertmanager.slack.enabled }}
# Pulls the Slack incoming-webhook URL from Azure Key Vault into a k8s Secret
# that the AlertmanagerConfig (alertmanager-config.yaml) reads via secretKeyRef.
#
# ExternalSecrets Operator syncs the KV entry on the configured refresh
# interval; the produced Secret has a single `url` key.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-slack-webhook
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: alertmanager-slack-webhook
    app.kubernetes.io/component: monitoring
spec:
  refreshInterval: {{ .Values.alertmanager.slack.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.alertmanager.slack.secretStore | default "azure-secretstore" }}
    kind: ClusterSecretStore
  target:
    name: alertmanager-slack-webhook
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        url: {{ `"{{ .webhook }}"` }}
  data:
    - secretKey: webhook
      remoteRef:
        key: {{ .Values.alertmanager.slack.externalSecretKey | required "alertmanager.slack.externalSecretKey is required" }}
{{- end }}
