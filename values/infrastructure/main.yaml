# Default values for monobase-infrastructure Helm chart
# These control cluster-wide infrastructure components

# ArgoCD Bootstrap Configuration
# Used by charts/argocd-bootstrap/ to create infrastructure-root and applicationset
argocd:
  # Git repository for GitOps
  # DEPLOYMENT-SPECIFIC: Override chart default (template points to monobaselabs/monobase-infra)
  repoURL: https://github.com/mycurelabs/monobase-infra-medicard.git
  targetRevision: main

  # ArgoCD Installation Configuration
  # Chart: https://github.com/argoproj/argo-helm
  # Version: 5.x+

  # Simplified configuration (non-HA)
  redis-ha:
    enabled: false  # Use standard Redis instead

  # Controller (reconciliation engine)
  controller:
    replicas: 1  # Single replica sufficient for simple deployments

    metrics:
      enabled: true
      serviceMonitor:
        enabled: false  # Enable when monitoring stack is deployed

    resources:
      requests:
        cpu: 250m
        memory: 768Mi  # Increased from 512Mi - prevent OOM (actual usage: 607Mi)
      limits:
        cpu: 1
        memory: 896Mi  # Optimized from 1Gi (actual usage: 608Mi = 68%)

  # Server (API and UI)
  server:
    # HA: stateless HTTP/gRPC surface. Two replicas + preferred hostname
    # anti-affinity so a node bounce doesn't drop the UI/API.
    replicas: 2

    metrics:
      enabled: true
      serviceMonitor:
        enabled: false

    resources:
      requests:
        cpu: 100m
        memory: 192Mi  # Optimized from 256Mi (actual usage: 31Mi = 16%)
      limits:
        cpu: 500m
        memory: 384Mi  # Optimized from 512Mi (actual usage: 31Mi = 8%)

    # Ingress via Gateway API (see ingress.yaml)
    ingress:
      enabled: false

    # Server configuration
    config:
      # Git repository credentials
      repositories: |
        - type: git
          url: https://github.com/mycurelabs/monobase-infra-medicard.git

      # Resource customizations
      resource.customizations: |
        argoproj.io/Application:
          health.lua: |
            hs = {}
            hs.status = "Progressing"
            hs.message = ""
            if obj.status ~= nil then
              if obj.status.health ~= nil then
                hs.status = obj.status.health.status
                if obj.status.health.message ~= nil then
                  hs.message = obj.status.health.message
                end
              end
            end
            return hs

    # RBAC configuration
    rbacConfig:
      policy.default: role:readonly
      policy.csv: |
        # Default policies
        p, role:readonly, applications, get, */*, allow
        p, role:readonly, projects, get, *, allow

        # Admin role
        g, admin, role:admin

    # Admin password (from secret)
    extraArgs:
      - --insecure  # TLS termination at Gateway

  # Repo Server (Git repository interaction)
  repoServer:
    # HA: stateless (git clones + Helm renders are transient per request).
    # Concurrent renders are thread-safe per ArgoCD's design; second pod
    # warms its Helm cache on demand.
    replicas: 2

    metrics:
      enabled: true
      serviceMonitor:
        enabled: false

    resources:
      requests:
        cpu: 100m
        memory: 1536Mi  # Increased to handle concurrent Helm renders
      limits:
        cpu: 1
        memory: 2560Mi  # Increased to prevent OOM during heavy sync operations

  # ApplicationSet Controller (App-of-Apps)
  applicationSet:
    enabled: true
    # HA: chart enables built-in leader-election, so only one pod drives
    # template expansions at a time; the second stands by for takeover.
    replicas: 2

    metrics:
      enabled: true
      serviceMonitor:
        enabled: false

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

  # Notifications Controller
  notifications:
    enabled: true

    argocdUrl: https://argocd-mycurex.medicardphils.com  # DEPLOYMENT-SPECIFIC: prod ArgoCD URL (behind MediCard App Gateway)

    # Slack token binding — resolves via the `argocd-notifications-secret`
    # k8s Secret populated by the ExternalSecret in
    # charts/argocd-infrastructure/templates/argocd-notifications-externalsecret.yaml.
    # TODO: populate KV entry `medicard-prod-argocd-slack-token` with a real
    # Slack bot token, then flip `notifications.slack.enabled: true` (below)
    # so the ExternalSecret renders. Until then $slack-token is unresolved
    # and Slack posts fail silently.
    slack:
      enabled: false
      externalSecretKey: medicard-prod-argocd-slack-token
      secretStore: azure-secretstore
      refreshInterval: 1h

    notifiers:
      # Slack notifications — `$slack-token` reference is populated at
      # runtime from the ExternalSecret-managed argocd-notifications-secret.
      service.slack: |
        token: $slack-token
      # Email notifications (requires SMTP configuration in deployment-specific values)
      # service.email: |
      #   host: smtp.gmail.com
      #   port: 587
      #   from: argocd@yourdomain.com

    templates:
      template.app-deployed: |
        message: |
          Application {{.app.metadata.name}} deployed to {{.app.spec.destination.namespace}}
        slack:
          attachments: |
            [{
              "title": "{{.app.metadata.name}}",
              "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
              "color": "#18be52",
              "fields": [{
                "title": "Sync Status",
                "value": "{{.app.status.sync.status}}",
                "short": true
              }, {
                "title": "Repository",
                "value": "{{.app.spec.source.repoURL}}",
                "short": true
              }]
            }]

      template.app-sync-failed: |
        message: |
          Application {{.app.metadata.name}} sync failed
        slack:
          attachments: |
            [{
              "title": "{{.app.metadata.name}}",
              "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
              "color": "#ff0000",
              "fields": [{
                "title": "Sync Status",
                "value": "{{.app.status.sync.status}}",
                "short": true
              }]
            }]

    triggers:
      trigger.on-deployed: |
        - when: app.status.sync.status == 'Synced'
          send: [app-deployed]

      trigger.on-sync-failed: |
        - when: app.status.sync.status == 'Failed'
          send: [app-sync-failed]

  # Dex (SSO/OAuth - optional)
  dex:
    enabled: false  # Enable for SSO integration

  # Configs
  configs:
    secret:
      createSecret: true
      # argocdServerAdminPassword: ""  # Set via External Secrets

    # Known hosts for Git SSH
    ssh:
      knownHosts: |
        github.com ssh-rsa 

  # Redis (cache) - standard single instance
  redis:
    enabled: true

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi

# Cert Manager - TLS certificate automation (infrastructure-wide)
# DISABLED: Client handles TLS externally via their own gateway
certManager:
  enabled: false

  # ClusterIssuers configuration
  issuers:
    # HTTP-01 challenge type (no DNS provider needed)
    - name: letsencrypt-prod
      email: "admin@mycure.stitchtechsolutions.com"
      server: production
      provider: http01
      http01:
        gatewayName: shared-gateway
        gatewayNamespace: gateway-system

    - name: letsencrypt-staging
      email: "admin@mycure.stitchtechsolutions.com"
      server: staging
      provider: http01
      http01:
        gatewayName: shared-gateway
        gatewayNamespace: gateway-system

# Gateway API - Ingress and routing
gateway:
  enabled: true

  # HA: bump the Envoy Gateway CONTROLLER to 2 replicas. This is
  # applied by charts/argocd-infrastructure/templates/gateway.yaml into
  # the gateway-helm chart's deployment.replicas key. The controller is
  # stateless — parallel reconcilers are safe.
  operator:
    replicas: 2

  # DEPLOYMENT-SPECIFIC: Override chart default (template uses example.com)
  domain: medicardphils.com

  # Gateway listeners - TLS is handled externally
  gateway:
    listeners:
      https:
        enabled: false  # DISABLED: TLS handled by client's external gateway
      http:
        enabled: true   # HTTP only - external gateway handles TLS termination

  # ClusterIssuer for TLS certificates (not used when HTTPS disabled)
  clusterIssuer: letsencrypt-prod

  # GatewayClass configuration - Reference EnvoyProxy for static IP
  gatewayClass:
    parametersRef:
      enabled: true
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: custom-proxy-config
      namespace: envoy-gateway-system

  # TLS/Certificate configuration - Per-app certificates
  # DEPLOYMENT-SPECIFIC: Certificate hostnames for this deployment (staging only)
  # DISABLED: TLS is handled externally by client's gateway
  certificates:
    - name: staging-hapihub-tls
      hostname: api.mycurex.medicardphils.com
      enabled: false
    - name: staging-mycure-tls
      hostname: cms.mycurex.medicardphils.com
      enabled: false
    - name: staging-minio-tls
      hostname: storage.mycurex.medicardphils.com
      enabled: false
    - name: staging-cadence-tls
      hostname: sync.mycurex.medicardphils.com
      enabled: false
    - name: staging-mailpit-tls
      hostname: mail.mycurex.medicardphils.com
      enabled: false

  # HTTP to HTTPS redirect
  # DEPLOYMENT-SPECIFIC: Override chart default (disabled due to HTTP-01 ACME challenge)
  httpRedirect:
    enabled: false

# EnvoyProxy Configuration - Cloud-specific LoadBalancer settings
# DEPLOYMENT-SPECIFIC: Configure for Azure AKS with internal LoadBalancer
# Client's external gateway terminates TLS and forwards HTTP to this internal IP
envoyProxyConfig:
  enabled: true
  cloudProvider: azure

  # HA: bump the auto-created data-plane Deployment
  # (`envoy-gateway-system-shared-gateway-*`) to 2 replicas + preferred
  # hostname anti-affinity. Rendered by charts/envoy-proxy-config into
  # the EnvoyProxy CR referenced by the GatewayClass parametersRef above.
  envoyDeployment:
    replicas: 2
    pod:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: proxy
                topologyKey: kubernetes.io/hostname

  # Azure AKS Configuration - Internal LoadBalancer with static private IP
  azure:
    publicIpName: ""
    resourceGroup: ""
    # ponytail: empty → Azure auto-allocates from AKS subnet 172.22.40.0/22.
    # Capture the allocated IP post-deploy and hand to MediCard for
    # mc-traffic-mgr-mpi-prd.trafficmanager.net wiring. Pin here once known.
    ipv4Address: ""

  # Internal LoadBalancer - provides private IP within Azure VNet
  # Client's gateway routes to this internal IP after TLS termination
  customAnnotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"

# External Secrets - Secret management
externalSecrets:
  enabled: true

  # HA: scale controller + webhook + cert-controller to 2 replicas.
  # ESO controller has built-in leader-election; webhook and cert-
  # controller are stateless.
  replicas: 2

  # Workload identity binding. Same UAMI as staging per sheet row 5.b.iii
  # ("no separate MI"). Tenant same per 5.b.ii. Vault RBAC per 5.b.v.
  # These flow to the external-secrets ServiceAccount so ESO can present
  # an OIDC token to Azure AD.
  serviceAccountAnnotations:
    azure.workload.identity/client-id: d6b958ed-790e-4a8a-9ce0-10aa6c0776b8
    azure.workload.identity/tenant-id: 31e62360-d307-45a7-932a-f774aa7a6288

  # ClusterSecretStore configurations
  # See charts/external-secrets-stores/README.md for detailed configuration
  # DEPLOYMENT-SPECIFIC: Azure Key Vault configuration
  stores:
    # Azure Key Vault store
    - name: azure-secretstore
      provider: azure
      azure:
        vaultUrl: "https://kv-mpi-sea-p-mycurex01.vault.azure.net"
        tenantId: "31e62360-d307-45a7-932a-f774aa7a6288"
        auth:
          workloadIdentity:
            enabled: true
            serviceAccountRef:
              name: external-secrets
              namespace: external-secrets-system

# External DNS - Automatic DNS record management from HTTPRoutes
# DISABLED: MediCard uses manual DNS management
externalDNS:
  enabled: false

  # External Secrets configuration
  # Creates ExternalSecret to sync DNS provider API token from secret manager
  externalSecrets:
    enabled: true
    secretStore: "azure-secretstore"
    refreshInterval: "1h"
    remoteKey: "medicard-infra-cloudflare-api-token"
    generator:
      generate: false
      type: token
      description: "Cloudflare API token for DNS management"

  # Multiple External DNS instances
  # Each instance can manage different DNS provider and domains
  instances:
    # Primary instance: Cloudflare for mycure.stitchtechsolutions.com (all environments)
    - name: primary
      enabled: true
      provider: cloudflare

      # Manage all mycure.stitchtechsolutions.com subdomains across all namespaces
      domainFilters:
        - mycure.stitchtechsolutions.com

      # Cloudflare-specific configuration
      cloudflare:
        proxied: false  # DNS only, no Cloudflare proxy
        apiTokenSecretRef:
          name: cloudflare-api-token
          key: api-token

      # Resource limits
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi

# Kyverno - Policy engine.
# Operator + three ClusterPolicies from charts/kyverno-resources:
#   podSecurity        (enforce) - PSS restricted profile check
#   requireLabels      (enforce) - standard ownership/env labels required
#   restrictRegistries (audit)   - flag images from non-allowlisted registries
# restrictRegistries stays audit-only until we've soaked the allow-list
# against real prod traffic; flip to enforce once no false positives.
kyverno:
  enabled: true
  version: "3.2.0"
  namespace: kyverno
  # HA: 2 replicas per controller. Admission webhooks are stateless;
  # background/reports/cleanup controllers use leader-election.
  replicas: 2
  policies:
    enabled: true
    # Both flipped enforce → audit on 2026-07-13 to unblock HA rollouts.
    # F1.4a shipped these as `enforce` prophylactically; when HA phase 1
    # tried to roll a second hapihub replica the RS controller was
    # admission-denied because tenant charts don't currently set
    # `securityContext.runAsNonRoot=true` (pod-security) or the
    # `app`/`environment`/`client` label taxonomy (require-labels).
    # Correct long-term fix is chart-side compliance; until then, `audit`
    # keeps the violations visible in PolicyReports without blocking pod
    # creation.
    podSecurity:
      enabled: true
      action: audit
    requireLabels:
      enabled: true
      action: audit
    restrictRegistries:
      enabled: true
      action: audit

# Velero - Backup and disaster recovery
# Chart 12.0.1 (Velero 1.18). Enabled; credentials reuse the same Key Vault
# entry s3proxy uses (storage-account key). See
# docs/operations/VELERO-CONFIGURATION.md for the enable-time checklist.
#
# Two upstream items still needed before velero comes up green:
# 1. MediCard populates KV `medicard-prod-azureblob-account-name` and
#    -account-key (same entries s3proxy is waiting on).
# 2. A blob container exists in the storage account. MediCard pre-created
# `blobmpseapmycurex01`; velero (and s3proxy/hapihub) reuse it — no
# separate container needed on their side.
velero:
  enabled: true
  version: 12.0.1
  provider: azure
  azure:
    # Same storage account s3proxy writes to. Value also mirrored in KV
    # under medicard-prod-azureblob-account-name.
    storageAccount: "sampseapmycurex01"
    # Reuse MediCard's pre-created container (verified via read-only probe
    # against the storage account key on 2026-07-10). Velero prefixes its
    # objects, hapihub uses different paths, so cohabitation is safe.
    blobContainer: "blobmpseapmycurex01"
  externalSecrets:
    secretStore: azure-secretstore
    azureBlobKeyKey: medicard-prod-azureblob-account-key
  schedules:
    infrastructure:
      hourly:
        enabled: false
      daily:
        enabled: true
        schedule: "0 3 * * *"     # 03:00 UTC daily
        retention: "720h"         # 30 days
    cluster:
      weekly:
        enabled: true
        schedule: "0 4 * * 0"     # 04:00 UTC every Sunday
        retention: "2160h"        # 90 days — DR archive / compliance floor

# Falco - Runtime security monitoring.
# Operator + custom rulesets from charts/falco-resources:
#   api      - detection rules for the Monobase API application
#   database - detection rules for PostgreSQL container behaviour
# Falco emits to stdout by default; Promtail ships those to Loki, so
# alerts land in Grafana. When P0.1 Slack routing is populated in KV,
# Falco alerts can be forwarded via Alertmanager as well.
falco:
  enabled: true
  # Chart 4.6.1 ships Falco 0.38.1, which fails scap_init on AKS's
  # 6.8.0-azure kernel (modern-BPF verifier / libscap incompat, upstream
  # bug closed in Falco 0.39.0). Bumping to chart 9.1.0 (Falco 0.44.1)
  # to pick up the fix. No values-key drift for the keys we set — the
  # 4→9 chart diff is additive only.
  version: "9.1.0"
  namespace: falco
  rules:
    enabled: true
    api:
      enabled: true
    database:
      enabled: true

# Loki - Log aggregation (Loki + Promtail)
loki:
  enabled: true

  # Loki version
  version: "6.24.0"

  # Storage
  storageSize: "50Gi"

  # Log retention period
  retention: "30d"

  # Promtail (log collector agent)
  promtail:
    version: "6.16.6"

# Monitoring - Prometheus + Grafana stack
monitoring:
  enabled: true
  
  # Prometheus configuration
  prometheus:
    retention: 30d  # How long to keep metrics
    storageSize: 50Gi  # Prometheus data storage
    storageClass: ""  # Auto-detect from cluster default
  
  # Grafana configuration (deployed as separate wrapper chart)
  grafana:
    enabled: true  # Enable Grafana deployment

    # Gateway configuration for Grafana UI access
    # ponytail: proxy-only in prod. No HTTPRoute, no public FQDN. Ops
    # reach the UI via `kubectl -n monitoring port-forward svc/grafana`.
    gateway:
      enabled: false
      hostname: ""
      tls:
        certManager:
          enabled: false

    # HA: in-cluster PostgreSQL as Grafana's shared metadata store, so
    # multiple Grafana replicas see one source of truth. See
    # charts/grafana/{Chart.yaml, values.yaml, templates/
    # postgresql-externalsecret.yaml}. Password is minted by ESO Password
    # generator — no KV entry needed.
    postgresql:
      enabled: true

    externalSecrets:
      enabled: true

    # Bitnami subchart values (pass-through via `grafana:` key)
    grafana:
      replicaCount: 2

      # PVC is now unnecessary — state lives in the in-cluster Postgres.
      # Turning it off avoids ReadWriteOnce PVCs blocking multi-replica
      # scheduling.
      persistence:
        enabled: false

      # Wire the built-in GF_DATABASE_* env vars so Grafana boots against
      # the in-cluster Postgres (service `grafana-postgresql`, port 5432,
      # database `grafana`, user `grafana`). Password mounted from the
      # ExternalSecret-managed `grafana-postgresql-secret`.
      extraEnvVars:
        - name: GF_DATABASE_TYPE
          value: postgres
        - name: GF_DATABASE_HOST
          value: grafana-postgresql:5432
        - name: GF_DATABASE_NAME
          value: grafana
        - name: GF_DATABASE_USER
          value: grafana
        - name: GF_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-postgresql-secret
              key: password

      podDisruptionBudget:
        create: true
        minAvailable: 1

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: grafana
                topologyKey: kubernetes.io/hostname
  
  # Alertmanager - enabled. Receiver routing (Slack) is configured in the
  # monitoring-resources chart via an AlertmanagerConfig CR + ExternalSecret,
  # gated behind monitoring-resources' `alertmanager.slack.enabled` flag.
  # TODO: populate KV entry `medicard-prod-alertmanager-slack-webhook` with
  # the actual Slack incoming-webhook URL, then set
  # `alertmanager.slack.enabled: true` in values/deployments/medicard.yaml
  # under the `monitoring-resources:` block (or wherever the chart values
  # get injected). Until then alerts fire silently.
  alertmanager:
    enabled: true
    # HA: 3 replicas for gossip-quorum dedup. Chart wires the peer
    # discovery + cluster.peer args automatically. With only 2 zones
    # available, one zone runs 2/3 pods (soft anti-affinity does its
    # best but doesn't fail scheduling); a full zone outage takes 2/3
    # of the cluster but AM state (silences, active alerts) is
    # reconstructable from what remains.
    replicaCount: 3
