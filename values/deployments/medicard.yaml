# MediCard Staging Configuration
# Staging environment on Azure AKS
# Domain: *-mycurex-dev.medicardphils.com

global:
  domain: medicardphils.com
  namespace: medicard-staging
  environment: staging

# ===== DISABLED: Monobase API (using HapiHub instead) =====
api:
  enabled: false

# ===== DISABLED: Monobase Account Frontend =====
account:
  enabled: false

# ===== DISABLED: Patient Frontend =====
patient:
  enabled: false

# ===== DISABLED: Provider Frontend =====
provider:
  enabled: false

# ===== DISABLED: Website Frontend =====
website:
  enabled: false

# ===== DISABLED: MyCure V8 (Legacy) =====
mycurev8:
  enabled: false

# ===== DISABLED: DentaLemon =====
dentalemon:
  enabled: false

# ===== HEALTHCARE: HapiHub API =====
hapihub:
  enabled: true

  image:
    repository: ghcr.io/mycurelabs/hapihub
    tag: "11.20.137-medicard.1"
    pullPolicy: IfNotPresent

  # 2 replicas like prod: one slow request (e.g. lab worklist) no longer stalls the only pod (#4521).
  replicaCount: 2

  nodeSelector:
    kubernetes.io/arch: amd64

  # Sized to own the single amd64 app node (D8ds_v5: 7.8 CPU / 30.6 GiB
  # allocatable), which only runs hapihub + mycure plus ~1.5 CPU / 2.5 GiB of
  # system/sidecar requests. 2Gi OOM-looped ~41x under MediCard's first real
  # usage (monobase-mycure#5712). 2 x 11Gi limits + ~4 GiB actual system use
  # leaves ~4.5 GiB node headroom. Revisit if more apps land on this node.
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "3"
      memory: 11Gi

  gateway:
    hostnames:
      - "api-mycurex-dev.medicardphils.com"
    sectionName: http  # External gateway handles TLS
    snippetsPolicy:
      enabled: false

  config:
    CLUSTER_INSTANCES: "2"
    BETTER_AUTH_RATE_LIMIT_ENABLED: "true"
    BETTER_AUTH_RATE_LIMIT_WINDOW: "60"
    BETTER_AUTH_RATE_LIMIT_MAX: "300"
    BETTER_AUTH_SESSION_COOKIE_CACHE_ENABLED: "false"
    CORS_ORIGINS: "https://cms-mycurex-dev.medicardphils.com"

  livenessProbe:
    enabled: true

  readinessProbe:
    enabled: true

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  autoscaling:
    enabled: false

  externalSecrets:
    enabled: true
    secretStore: azure-secretstore
    secretStoreKind: ClusterSecretStore
    refreshInterval: 1h
    # Syncs `hapihub-secrets` from Azure KV (kv-mpi-sea-a-mycurex01) via the
    # staging ClusterSecretStore. All entries confirmed present + ESO-readable
    # (monobase-mycure#4521, 2026-10-14). Mirrors the PROD key set with the
    # `medicard-staging-` prefix. secretKey = k8s Secret key; remoteKey = KV entry.
    secrets:
      - secretKey: DATABASE_URI
        remoteKey: medicard-staging-database-uri
      - secretKey: AUTH_SECRET
        remoteKey: medicard-staging-auth-secret
      - secretKey: ENC_MEDICAL_RECORDS
        remoteKey: medicard-staging-enc-medical-records
      - secretKey: ENC_PERSONAL_DETAILS
        remoteKey: medicard-staging-enc-personal-details
      - secretKey: ENC_BILLING_INVOICES
        remoteKey: medicard-staging-enc-billing-invoices
      - secretKey: ENC_BILLING_ITEMS
        remoteKey: medicard-staging-enc-billing-items
      - secretKey: ENC_BILLING_PAYMENTS
        remoteKey: medicard-staging-enc-billing-payments
      # hapihub is PG-only and reads MONGO_URI as optional; synced so the key
      # exists for a read-only mongo client pod if needed.
      - secretKey: MONGO_URI
        remoteKey: medicard-staging-mongo-source-uri

  # v11: PostgreSQL-only (external Azure PG)
  postgresql:
    enabled: true
    external: true  # DATABASE_URI from hapihub-secrets

  mongodb:
    enabled: false  # v11 is PG-only

  minio:
    # `minio` here is a legacy values-namespace name — the actual backend
    # is s3proxy (see the top-level `s3proxy:` block), mirroring prod.
    # serviceName / secretName point hapihub's STORAGE_S3_* env at the
    # s3proxy Service + Secret.
    enabled: true
    serviceName: s3proxy
    secretName: s3proxy
    # Azure Blob container in MediCard's staging storage account
    # (sampseaamycurex01); created 2026-10-19 after MediCard opened network
    # access from the staging subnet (monobase-mycure#4521).
    defaultBuckets: "blobmpseaamycurex01"

  valkey:
    enabled: false

  mailpit:
    enabled: true

# ===== HEALTHCARE: MyCure Frontend =====
mycure:
  enabled: true

  image:
    repository: ghcr.io/mycurelabs/mycureapp
    tag: "10.25.146-medicard.3"
    pullPolicy: IfNotPresent

  replicaCount: 2

  nodeSelector:
    kubernetes.io/arch: amd64

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  gateway:
    hostname: "cms-mycurex-dev.medicardphils.com"
    listener: http  # External gateway handles TLS

  config:
    API_URL: "https://api-mycurex-dev.medicardphils.com"
    HAPIHUB_URL: "https://api-mycurex-dev.medicardphils.com"
    # CSP connect-src for this tenant (mycureapp >=10.25.104 reads CONNECT_SRC).
    # Mirrors prod (main) with the staging API host. Without it the image's default
    # allows only *.localfirsthealth.com and every API call is blocked by the browser.
    CONNECT_SRC: "'self' https://api-mycurex-dev.medicardphils.com wss://api-mycurex-dev.medicardphils.com https://us.i.posthog.com https://us-assets.i.posthog.com https://www.googletagmanager.com https://*.google-analytics.com https://speed.cloudflare.com"

  podDisruptionBudget:
    enabled: false

# ===== HEALTHCARE: Cadence Real-time Sync (WebSocket) =====
# Disabled: matching preprod 2026-04-07 incident decision
cadence:
  enabled: false

  image:
    repository: ghcr.io/mycurelabs/syncd
    tag: "5.130.24"
    pullPolicy: IfNotPresent

  replicaCount: 1

  nodeSelector:
    kubernetes.io/arch: amd64

  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: "2"
      memory: 4Gi

  gateway:
    hostname: "sync-mycurex-dev.medicardphils.com"
    listener: http  # External gateway handles TLS

  livenessProbe:
    enabled: true

  readinessProbe:
    enabled: true

  podDisruptionBudget:
    enabled: false

  autoscaling:
    enabled: false

  externalSecrets:
    enabled: false

  mongodb:
    serviceName: mongodb
    database: hapihub
    username: root

# ===== DATABASE: PostgreSQL =====
# Disabled: hapihub 11.x connects to external Azure PG
postgresql:
  enabled: false

  # External Secrets configuration
  externalSecrets:
    enabled: true
    secretStore: azure-secretstore
    remoteKey: medicard-staging-postgresql-password
    generator:
      generate: true
      type: password
      description: PostgreSQL admin password

  # Bitnami PostgreSQL subchart configuration
  postgresql:
    fullnameOverride: "postgresql"
    architecture: standalone

    image:
      repository: bitnamilegacy/postgresql
      tag: 16.4.0-debian-12-r13

    auth:
      enabled: true
      existingSecret: postgresql
      secretKeys:
        adminPasswordKey: postgres-password
      database: postgres
      username: postgres

    persistence:
      enabled: true
      storageClass: ""
      size: 20Gi

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 1Gi

    podDisruptionBudget:
      enabled: false

# ===== DATABASE: MongoDB (FerretDB with PostgreSQL backend) =====
# Disabled: hapihub 11.x is PG-only
mongodb:
  enabled: false

  image:
    repository: ghcr.io/ferretdb/ferretdb
    tag: "2.7.0"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  postgresql:
    image:
      repository: ghcr.io/ferretdb/postgres-documentdb
      tag: "17-0.107.0-ferretdb-2.7.0"
      pullPolicy: IfNotPresent

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

    persistence:
      enabled: true
      storageClass: ""
      size: 20Gi

  auth:
    username: "root"
    database: "postgres"
    existingSecret: "mongodb"

  externalSecrets:
    enabled: true
    secretStore: azure-secretstore
    refreshInterval: 1h
    passwordKey: medicard-staging-mongodb-root-password

  networkPolicy:
    enabled: true

# ===== CACHE: Valkey (Redis) =====
valkey:
  enabled: false

# ===== STORAGE: MinIO Object Storage (Bitnami subchart) =====
# Disabled — s3proxy (below) replaces it, as in prod. Hapihub is pointed at
# s3proxy via hapihub.minio.serviceName / secretName above.
minio:
  enabled: false

# ===== STORAGE: s3proxy → native Azure Blob =====
# Stateless S3→Blob translator (jclouds azureblob). Presents an S3 API on
# port 9000 as a Service named `s3proxy`. All bytes live in MediCard's
# staging storage account sampseaamycurex01 (prod pattern; monobase-mycure#4521).
s3proxy:
  enabled: true

  # HA: 2 replicas. s3proxy is a pure jclouds pass-through — no local
  # state — so a second pod behind the Service is safe.
  replicaCount: 2

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - s3proxy
            topologyKey: kubernetes.io/hostname

  externalSecrets:
    enabled: true
    secretStore: azure-secretstore
    secretStoreKind: ClusterSecretStore
    azureAccountKey: medicard-staging-azureblob-account-name
    azureBlobKeyKey: medicard-staging-azureblob-account-key

  container: blobmpseaamycurex01

  gateway:
    enabled: true
    hostname: "storage-mycurex-dev.medicardphils.com"
    listener: http  # External gateway terminates TLS

# ===== EMAIL TESTING: Mailpit =====
mailpit:
  enabled: true

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

  gateway:
    enabled: false  # Internal only - no external access
    hostname: ""

# ===== MIGRATION: hapihub-migrator (MongoDB → PostgreSQL) =====
hapihubMigrator:
  enabled: true

  image:
    repository: ghcr.io/mycurelabs/hapihub-migrator
    # 3.13.5 (mycurelabs/monobase-mycure#5745): history rows get _h_created_at/_h_created_by from Mongo _createdAt/_createdBy.
    # 3.13.4 (mycurelabs/monobase-mycure#5667): refuses *_history collections unless the PG table is PRIMARY KEY (id).
    #   On staging the 4 *_history tables have NO PK until the #5653 phase-2 backfill runs, so history
    #   collections fail on purpose until then; non-history collections are unaffected.
    # 3.13.3 (mycurelabs/monobase-mycure#5399): no-table -> verify skip (not fail); unknown COLLECTIONS hard-fail at startup.
    # 3.13.2 (mycurelabs/monobase-mycure#5381): Atlas failover/shutdown errors retryable in the cursor-retry path.
    # 3.13.1 (mycurelabs/monobase-mycure#5379): SUPPRESS_TRIGGERS via per-connection SET (Azure admin role
    # is not superuser, startup-option form is denied); fail-closed SHOW gate kept.
    # 3.13.0 (mycurelabs/monobase-mycure#5254): typed checkpoint resume, byte-capped batches,
    # transient-cursor retry, windowed verification — fixes mycurelabs/monobase-mycure#5253.
    # legacy org-type normalization, OOM guards. Bump only via the migrator
    # release process. (#4521 — staging migrator aligned to the prod line.)
    tag: "3.13.5"
    pullPolicy: IfNotPresent

  nodeSelector:
    kubernetes.io/arch: amd64

  gateway:
    enabled: false

  # Disabled: the chart's NetworkPolicy egress rules for PG/Mongo/HTTPS use
  # namespaceSelector (in-cluster only) with no ipBlock, so if the cluster
  # enforces egress policy it would block the migrator's reach to the EXTERNAL
  # Azure PG (mpiazeapgdb0002, public IP) and Mongo Atlas — the exact paths
  # validated in #4521. Cluster egress is already unrestricted + verified.
  networkPolicy:
    enabled: false

  # Long-lived read-only monitoring UI (its own Deployment). The migration
  # itself runs as the SUSPENDED CronJob below, not this Deployment.
  dashboard:
    enabled: true
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true

  # Migration runs as a SUSPENDED CronJob — operators trigger a run via
  # `kubectl create job --from=cronjob/<release>-hapihub-migrator`. Runs to
  # completion and exits. Kept suspended: the first run must be deliberate
  # (enc-key correctness is only verifiable live) and targets a ~2.2 TB DB.
  migrationJob:
    enabled: true
    suspend: true
    backoffLimit: 0        # a failed migration must not silently retry (AUDIT)
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 32Gi

  migration:
    mode: "bulk"
    batchSize: "500"
    collectionConcurrency: "1"
    resume: "true"         # resume the latest in-progress run
    existingSecret: "hapihub-migration-secrets"

  # ── GridFS → S3 storage migration ──────────────────────────────────────
  # Without this the bulk run copies only storage.files METADATA and leaves the
  # file bytes behind — attachments/documents would 404 in the new stack.
  # Target is the in-cluster s3proxy (S3 → Azure Blob), same container hapihub
  # reads from, so hapihub resolves the migrated storage_files keys. Mirrors prod.
  storage:
    enabled: true
    bucket: "blobmpseaamycurex01"
    endpoint: "http://s3proxy:9000"
    region: "us-east-1"
    directory: "files"
    secretName: "s3proxy"
    accessKeyIdKey: "root-user"
    secretAccessKeyKey: "root-password"

  postgresql:
    uriSecret:
      name: "hapihub-migration-secrets"
      key: "pg-target-uri"

  # Syncs `hapihub-migration-secrets` from Azure KV (kv-mpi-sea-a-mycurex01) via
  # the staging ClusterSecretStore. Mirrors the PROD migrator key set with the
  # `medicard-staging-` prefix; all entries confirmed present + ESO-readable
  # (monobase-mycure#4521, 2026-10-14). pg-encryption-key intentionally omitted
  # (AUDIT CRYPTO-1 — the migrator never reads it; PG PII is plaintext).
  # NOTE: the enc-* VALUES must match the keys used to encrypt the
  # medicard-production Mongo source, or decryption fails on the first run.
  externalSecrets:
    enabled: true
    secretStore: azure-secretstore
    secretStoreKind: ClusterSecretStore
    refreshInterval: 1h
    secrets:
      - secretKey: mongo-source-uri
        remoteKey: medicard-staging-mongo-source-uri
      - secretKey: pg-target-uri
        remoteKey: medicard-staging-pg-target-uri
      - secretKey: enc-personal-details
        remoteKey: medicard-staging-enc-personal-details
      - secretKey: enc-medical-records
        remoteKey: medicard-staging-enc-medical-records
      - secretKey: enc-billing-invoices
        remoteKey: medicard-staging-enc-billing-invoices
      - secretKey: enc-billing-items
        remoteKey: medicard-staging-enc-billing-items
      - secretKey: enc-billing-payments
        remoteKey: medicard-staging-enc-billing-payments

# ===== BACKUP =====
backup:
  enabled: false

# ===== SECURITY =====
podSecurityStandards:
  enabled: true
  level: restricted

# ===== RESOURCE QUOTAS =====
resourceQuotas:
  enabled: false
