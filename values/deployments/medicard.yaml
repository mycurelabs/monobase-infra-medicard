# MediCard PROD Configuration
# Production environment on Azure AKS (aks-mpi-sea-p-mycurex01)
# Domain: *-mycurex.medicardphils.com
# KV: kv-mpi-sea-p-mycurex01
# PG target: mpiazeppgdb0003.postgres.database.azure.com (user mycure_prod_app)
# Mongo source: mycure-stg-sh.q4trx.mongodb.net (db medicard-production)

global:
  domain: medicardphils.com
  # ponytail: namespace matches the deployment filename (medicard.yaml).
  # No -prod/-staging suffix — each cluster tracks its own git branch, so
  # collision-avoiding suffixes are dead weight.
  namespace: medicard
  environment: production

# ===== DISABLED: Monobase API (using HapiHub instead) =====
api:
  enabled: false

# ===== DISABLED: Monobase Account Frontend =====
account:
  enabled: false

# ===== DISABLED: Patient Frontend =====
patient:
  enabled: false

# ===== DISABLED: Provider Frontend =====
provider:
  enabled: false

# ===== DISABLED: Website Frontend =====
website:
  enabled: false

# ===== DISABLED: MyCure V8 (Legacy) =====
mycurev8:
  enabled: false

# ===== DISABLED: DentaLemon =====
dentalemon:
  enabled: false

# ===== HEALTHCARE: HapiHub API =====
hapihub:
  enabled: true

  image:
    repository: ghcr.io/mycurelabs/hapihub
    tag: "11.20.47"
    pullPolicy: IfNotPresent

  replicaCount: 1

  nodeSelector:
    kubernetes.io/arch: amd64

  resources:
    requests:
      cpu: 1000m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 2Gi

  gateway:
    hostnames:
      - "api-mycurex.medicardphils.com"
    sectionName: http  # External gateway handles TLS
    snippetsPolicy:
      enabled: false

  config:
    CLUSTER_INSTANCES: "1"
    BETTER_AUTH_RATE_LIMIT_ENABLED: "true"
    BETTER_AUTH_RATE_LIMIT_WINDOW: "60"
    BETTER_AUTH_RATE_LIMIT_MAX: "300"
    BETTER_AUTH_SESSION_COOKIE_CACHE_ENABLED: "false"
    CORS_ORIGINS: "https://cms-mycurex.medicardphils.com"

  livenessProbe:
    enabled: true

  readinessProbe:
    enabled: true

  podDisruptionBudget:
    enabled: false

  autoscaling:
    enabled: false

  externalSecrets:
    enabled: true  # Enables secret mounting in deployment; ESO resource skipped (secrets: [])
    secretStore: azure-secretstore
    secretStoreKind: ClusterSecretStore
    refreshInterval: 1h
    secrets: []

  # v11: PostgreSQL-only (external Azure PG)
  postgresql:
    enabled: true
    external: true  # DATABASE_URI from hapihub-secrets

  mongodb:
    enabled: false  # v11 is PG-only

  minio:
    # ponytail: MinIO the subchart stays off — s3proxy replaces it and
    # advertises itself as a Service named `minio` (fullnameOverride) so
    # hapihub's chart branch works verbatim.
    enabled: true
    defaultBuckets: "monobase-files"

  valkey:
    enabled: false

  mailpit:
    enabled: false  # No mailpit in prod

# ===== HEALTHCARE: MyCure Frontend =====
mycure:
  enabled: true

  image:
    repository: ghcr.io/mycurelabs/mycureapp
    tag: "10.25.68"
    pullPolicy: IfNotPresent

  replicaCount: 1

  nodeSelector:
    kubernetes.io/arch: amd64

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  gateway:
    hostname: "cms-mycurex.medicardphils.com"
    listener: http  # External gateway handles TLS

  config:
    API_URL: "https://api-mycurex.medicardphils.com"
    HAPIHUB_URL: "https://api-mycurex.medicardphils.com"

  podDisruptionBudget:
    enabled: false

# ===== HEALTHCARE: Cadence Real-time Sync (WebSocket) =====
# Disabled: matching preprod 2026-04-07 incident decision
cadence:
  enabled: false

  image:
    repository: ghcr.io/mycurelabs/syncd
    tag: "5.130.24"
    pullPolicy: IfNotPresent

  replicaCount: 1

  nodeSelector:
    kubernetes.io/arch: amd64

  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: "2"
      memory: 4Gi

  gateway:
    hostname: "sync-mycurex.medicardphils.com"
    listener: http  # External gateway handles TLS

  livenessProbe:
    enabled: true

  readinessProbe:
    enabled: true

  podDisruptionBudget:
    enabled: false

  autoscaling:
    enabled: false

  externalSecrets:
    enabled: false

  mongodb:
    serviceName: mongodb
    database: hapihub
    username: root

# ===== DATABASE: PostgreSQL =====
# Disabled: hapihub 11.x connects to external Azure PG
postgresql:
  enabled: false

  # External Secrets configuration
  externalSecrets:
    enabled: true
    secretStore: azure-secretstore
    remoteKey: medicard-staging-postgresql-password
    generator:
      generate: true
      type: password
      description: PostgreSQL admin password

  # Bitnami PostgreSQL subchart configuration
  postgresql:
    fullnameOverride: "postgresql"
    architecture: standalone

    image:
      repository: bitnamilegacy/postgresql
      tag: 16.4.0-debian-12-r13

    auth:
      enabled: true
      existingSecret: postgresql
      secretKeys:
        adminPasswordKey: postgres-password
      database: postgres
      username: postgres

    persistence:
      enabled: true
      storageClass: ""
      size: 20Gi

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 1Gi

    podDisruptionBudget:
      enabled: false

# ===== DATABASE: MongoDB (FerretDB with PostgreSQL backend) =====
# Disabled: hapihub 11.x is PG-only
mongodb:
  enabled: false

  image:
    repository: ghcr.io/ferretdb/ferretdb
    tag: "2.7.0"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  postgresql:
    image:
      repository: ghcr.io/ferretdb/postgres-documentdb
      tag: "17-0.107.0-ferretdb-2.7.0"
      pullPolicy: IfNotPresent

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

    persistence:
      enabled: true
      storageClass: ""
      size: 20Gi

  auth:
    username: "root"
    database: "postgres"
    existingSecret: "mongodb"

  externalSecrets:
    enabled: true
    secretStore: azure-secretstore
    refreshInterval: 1h
    passwordKey: medicard-staging-mongodb-root-password

  networkPolicy:
    enabled: true

# ===== CACHE: Valkey (Redis) =====
valkey:
  enabled: false

# ===== STORAGE: MinIO Object Storage (Bitnami subchart) =====
# Kept disabled — s3proxy (below) replaces it, taking the same Service name
# `minio` via fullnameOverride so hapihub's chart branch works verbatim.
minio:
  enabled: false

# ===== STORAGE: s3proxy → native Azure Blob =====
# Stateless S3→Blob translator (jclouds azureblob). Presents an S3 API on
# port 9000 through a Service literally named `minio` so hapihub finds it
# without any chart change. All bytes live in native Azure Blob per the
# Infrastructure Clarifications sheet (row 5.c.xii).
#
# Blockers before this goes green:
#   1. ESO ClusterSecretStore Ready (see bootstrap report §3.1 — MediCard MI).
#   2. KV entries populated in kv-mpi-sea-p-mycurex01:
#      - medicard-prod-azureblob-account-name  (MediCard writes)
#      - medicard-prod-azureblob-account-key   (MediCard writes)
#      - medicard-prod-s3proxy-credential      (we write once, random)
s3proxy:
  enabled: true
  fullnameOverride: minio  # Service + Secret both named `minio`

  externalSecrets:
    enabled: true
    secretStore: azure-secretstore
    secretStoreKind: ClusterSecretStore
    refreshInterval: 1h
    azureAccountKey: medicard-prod-azureblob-account-name
    azureBlobKeyKey: medicard-prod-azureblob-account-key
    s3CredentialKey: medicard-prod-s3proxy-credential

  container: monobase-files

  gateway:
    enabled: true
    hostname: "storage-mycurex.medicardphils.com"
    listener: http  # External gateway terminates TLS

# ===== EMAIL TESTING: Mailpit =====
mailpit:
  enabled: false  # No mailpit in prod

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

  gateway:
    enabled: false  # Internal only - no external access
    hostname: ""

# ===== MIGRATION: hapihub-migrator (MongoDB → PostgreSQL) =====
hapihubMigrator:
  enabled: true

  image:
    repository: ghcr.io/mycurelabs/hapihub-migrator
    tag: "3.9.3"
    pullPolicy: IfNotPresent

  replicaCount: 0

  nodeSelector:
    kubernetes.io/arch: amd64

  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 32Gi

  gateway:
    enabled: false

  livenessProbe:
    enabled: false

  readinessProbe:
    enabled: false

  migration:
    mode: "bulk"
    batchSize: "500"
    collectionConcurrency: "1"
    exitOnBulkEnd: "true"
    existingSecret: "hapihub-migration-secrets"
    # migrationTimestamp disabled — FerretDB stores _id as strings and timestamps
    # as numbers, so none of the timestamp strategies work. Migrate all data.
    # migrationTimestamp: "2026-03-08T00:00:00.000Z"
    # timestampStrategy: "objectid_only"

  postgresql:
    uriSecret:
      name: "hapihub-migration-secrets"
      key: "pg-target-uri"

# ===== BACKUP =====
backup:
  enabled: false

# ===== SECURITY =====
podSecurityStandards:
  enabled: true
  level: restricted

# ===== RESOURCE QUOTAS =====
resourceQuotas:
  enabled: false
