# MediCard PROD Configuration
# Production environment on Azure AKS (aks-mpi-sea-p-mycurex01)
# Domain: *-mycurex.medicardphils.com
# KV: kv-mpi-sea-p-mycurex01
# PG target: mpiazeppgdb0003.postgres.database.azure.com (user mycure_prod_app)
# Mongo source: mycure-stg-sh.q4trx.mongodb.net (db medicard-production)

global:
  domain: medicardphils.com
  # ponytail: namespace matches the deployment filename (medicard.yaml).
  # No -prod/-staging suffix — each cluster tracks its own git branch, so
  # collision-avoiding suffixes are dead weight.
  namespace: medicard
  environment: production

# ===== DISABLED: Monobase API (using HapiHub instead) =====
api:
  enabled: false

# ===== DISABLED: Monobase Account Frontend =====
account:
  enabled: false

# ===== DISABLED: Patient Frontend =====
patient:
  enabled: false

# ===== DISABLED: Provider Frontend =====
provider:
  enabled: false

# ===== DISABLED: Website Frontend =====
website:
  enabled: false

# ===== DISABLED: MyCure V8 (Legacy) =====
mycurev8:
  enabled: false

# ===== DISABLED: DentaLemon =====
dentalemon:
  enabled: false

# ===== HEALTHCARE: HapiHub API =====
hapihub:
  enabled: true

  image:
    repository: ghcr.io/mycurelabs/hapihub
    tag: "11.20.47"
    pullPolicy: IfNotPresent

  # HA: 2 replicas, one per node via chart-default preferred podAntiAffinity
  # (kubernetes.io/hostname). PDB (below) keeps at least 1 pod up during
  # voluntary disruptions. CLUSTER_INSTANCES matches replicaCount so
  # hapihub's internal worker count doesn't collide across pods.
  replicaCount: 2

  nodeSelector:
    kubernetes.io/arch: amd64

  resources:
    requests:
      cpu: 1000m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 2Gi

  gateway:
    hostnames:
      - "api-mycurex.medicardphils.com"
    sectionName: http  # External gateway handles TLS
    snippetsPolicy:
      enabled: false

  config:
    CLUSTER_INSTANCES: "2"
    BETTER_AUTH_RATE_LIMIT_ENABLED: "true"
    BETTER_AUTH_RATE_LIMIT_WINDOW: "60"
    BETTER_AUTH_RATE_LIMIT_MAX: "300"
    BETTER_AUTH_SESSION_COOKIE_CACHE_ENABLED: "false"
    CORS_ORIGINS: "https://cms-mycurex.medicardphils.com"

  # Daily CronJob to prune expired Better Auth session rows.
  # See charts/hapihub/templates/prune-sessions-cronjob.yaml.
  pruneExpiredSessions:
    enabled: true

  livenessProbe:
    enabled: true

  readinessProbe:
    enabled: true

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  autoscaling:
    enabled: false

  externalSecrets:
    enabled: true
    secretStore: azure-secretstore
    secretStoreKind: ClusterSecretStore
    refreshInterval: 1h
    # KV entries populated by MediCard in kv-mpi-sea-p-mycurex01. Each
    # entry populates a key in the k8s Secret `hapihub-secrets`, which
    # the Deployment references via optional secretKeyRef.
    #
    # AUTH_SECRET's KV entry is spelled `medicard-prod-AUTH-SECRET` in
    # the Azure Portal, but Azure KV secret names are case-insensitive
    # for both creation and read — the lowercase form here resolves to
    # the same secret. Keeps our naming consistent with the rest.
    #
    # BETTER_AUTH_SECRET is intentionally not listed — MediCard did not
    # populate it and the env is optional. Add when needed (prod is
    # empty, so a fresh value can be minted at any time).
    secrets:
      - secretKey: DATABASE_URI
        remoteKey: medicard-prod-database-uri
      - secretKey: AUTH_SECRET
        remoteKey: medicard-prod-auth-secret
      - secretKey: ENC_MEDICAL_RECORDS
        remoteKey: medicard-prod-enc-medical-records
      - secretKey: ENC_PERSONAL_DETAILS
        remoteKey: medicard-prod-enc-personal-details
      - secretKey: ENC_BILLING_INVOICES
        remoteKey: medicard-prod-enc-billing-invoices
      - secretKey: ENC_BILLING_ITEMS
        remoteKey: medicard-prod-enc-billing-items
      - secretKey: ENC_BILLING_PAYMENTS
        remoteKey: medicard-prod-enc-billing-payments
      # Mongo source URI (Atlas). hapihub itself is PG-only and reads
      # this env as optional — leaving MONGO_URI unset is fine at
      # runtime. Syncing it here gives us a k8s Secret key we can mount
      # into a read-only mongo client pod for investigation, until the
      # hapihub-migrator chart gains its own ExternalSecret template.
      - secretKey: MONGO_URI
        remoteKey: medicard-prod-mongo-source-uri

  # v11: PostgreSQL-only (external Azure PG)
  postgresql:
    enabled: true
    external: true  # DATABASE_URI from hapihub-secrets

  mongodb:
    enabled: false  # v11 is PG-only

  minio:
    # `minio` here is a legacy values-namespace name — the actual backend
    # is s3proxy (see the top-level `s3proxy:` block). serviceName /
    # secretName point hapihub's STORAGE_S3_* env at the s3proxy
    # Service + Secret.
    enabled: true
    serviceName: s3proxy
    secretName: s3proxy
    # Reuse MediCard's pre-created Azure Blob container. Velero writes
    # under its own prefix; hapihub uses distinct paths so cohabitation
    # is safe.
    defaultBuckets: "blobmpseapmycurex01"

  # Shared in-cluster Valkey (top-level `valkey:` block below). Same
  # instance cadence uses. hapihub's response cache activates only when
  # BOTH valkey.enabled AND cache.enabled — see charts/hapihub/templates/
  # deployment.yaml.
  valkey:
    enabled: true

  cache:
    enabled: true

  mailpit:
    enabled: false  # No mailpit in prod

# ===== HEALTHCARE: MyCure Frontend =====
mycure:
  enabled: true

  image:
    repository: ghcr.io/mycurelabs/mycureapp
    tag: "10.25.68"
    pullPolicy: IfNotPresent

  # HA: 2 replicas + preferred hostname anti-affinity so the two land on
  # different nodes. Chart ships `affinity: {}` empty by default, so we
  # set the block here.
  replicaCount: 2

  nodeSelector:
    kubernetes.io/arch: amd64

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - mycure
            topologyKey: kubernetes.io/hostname

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  gateway:
    hostname: "cms-mycurex.medicardphils.com"
    listener: http  # External gateway handles TLS

  config:
    API_URL: "https://api-mycurex.medicardphils.com"
    HAPIHUB_URL: "https://api-mycurex.medicardphils.com"

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# ===== HEALTHCARE: Cadence Real-time Sync (WebSocket) =====
# Re-enable attempt 2026-07-13 stalled on TLS handshake to Azure PG.
# Chart backport + postgresql.external mode landed (commit 0d73adc) —
# the code path works — but the cadence Rust PG driver fails the TLS
# handshake against mpiazeppgdb0003.postgres.database.azure.com:5432
# even with the shared hapihub DATABASE_URI (?sslmode=require). Likely
# the driver ships rustls without a CA bundle and needs either:
#   - an explicit sslrootcert path (mount Azure's DigiCert cert), OR
#   - PGSSLMODE=require env override + a driver flag to skip cert verify.
# Investigate before re-flipping. Chart, image, valkey wiring, and
# postgresql.external mode all stay in place so the flip is a single-
# value change once the TLS path is proven.
cadence:
  enabled: false

  image:
    repository: ghcr.io/mycurelabs/cadence
    tag: "0.7.10"
    pullPolicy: IfNotPresent

  replicaCount: 1

  nodeSelector:
    kubernetes.io/arch: amd64

  # Sized down from mycure prod (3Gi req / 12Gi lim) — that ceiling was
  # driven by mycure's 97-collection catch-up profile. MediCard starts
  # with the chart-default 2-collection allowlist (accounts + personal-
  # details) so memory pressure is far lower. Bump if OOM appears once
  # more collections are added.
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

  gateway:
    hostname: "sync-mycurex.medicardphils.com"
    sectionName: http  # External gateway handles TLS
    snippetsPolicy:
      enabled: false  # MediCard uses Envoy Gateway, not NGINX

  livenessProbe:
    enabled: true

  readinessProbe:
    enabled: true

  podDisruptionBudget:
    enabled: false

  autoscaling:
    enabled: false

  externalSecrets:
    enabled: false

  # External Azure PG — same DATABASE_URI hapihub uses. The chart's new
  # `postgresql.external: true` mode bypasses the constructor and mounts
  # CADENCE_PRIMARY_DB_URL directly from a secret (preserves sslmode=
  # require and other connection-string flags). Cadence owns its own
  # `cadence` schema in the shared PG database; ensure_sync_infra will
  # install triggers + indexes on first boot (needs DDL rights, which
  # mycure_prod_app has via azure_pg_admin).
  postgresql:
    enabled: false
    external: true
    auth:
      existingSecret: hapihub-secrets
      uriKey: DATABASE_URI

  # Shared in-cluster valkey (same instance hapihub caches into).
  valkey:
    enabled: true
    serviceName: valkey-primary
    port: 6379
    auth:
      existingSecret: valkey
      secretKey: valkey-password

  # HapiHub JWKS endpoint for JWT validation. Chart default `hapihub:7500`
  # matches the in-cluster Service in the medicard namespace.
  hapihub:
    serviceName: hapihub
    port: 7500

  # Phase 3 pgChangelog stays off — dual-write to PG + Valkey is a
  # mycure-scale-only optimization. Enable later if we see valkey memory
  # pressure or want PG-authoritative changelog reads.
  pgChangelog:
    enabled: false

# ===== DATABASE: PostgreSQL =====
# Disabled: hapihub 11.x connects to external Azure PG
postgresql:
  enabled: false

  # External Secrets configuration
  externalSecrets:
    enabled: true
    secretStore: azure-secretstore
    remoteKey: medicard-staging-postgresql-password
    generator:
      generate: true
      type: password
      description: PostgreSQL admin password

  # Bitnami PostgreSQL subchart configuration
  postgresql:
    fullnameOverride: "postgresql"
    architecture: standalone

    image:
      repository: bitnamilegacy/postgresql
      tag: 16.4.0-debian-12-r13

    auth:
      enabled: true
      existingSecret: postgresql
      secretKeys:
        adminPasswordKey: postgres-password
      database: postgres
      username: postgres

    persistence:
      enabled: true
      storageClass: ""
      size: 20Gi

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 1Gi

    podDisruptionBudget:
      enabled: false

# ===== DATABASE: MongoDB (FerretDB with PostgreSQL backend) =====
# Disabled: hapihub 11.x is PG-only
mongodb:
  enabled: false

  image:
    repository: ghcr.io/ferretdb/ferretdb
    tag: "2.7.0"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  postgresql:
    image:
      repository: ghcr.io/ferretdb/postgres-documentdb
      tag: "17-0.107.0-ferretdb-2.7.0"
      pullPolicy: IfNotPresent

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

    persistence:
      enabled: true
      storageClass: ""
      size: 20Gi

  auth:
    username: "root"
    database: "postgres"
    existingSecret: "mongodb"

  externalSecrets:
    enabled: true
    secretStore: azure-secretstore
    refreshInterval: 1h
    passwordKey: medicard-staging-mongodb-root-password

  networkPolicy:
    enabled: true

# ===== CACHE: Valkey (Redis) =====
# In-cluster Bitnami valkey subchart. Shared instance backs hapihub's
# response cache (V1/V2) AND cadence's metadata backend (C1). Password
# minted in-cluster by ESO Password generator (charts/hapihub/templates/
# valkey-externalsecret.yaml) — no KV entry needed.
#
# Sized down from mycure prod (32Gi PVC / 2Gi mem req): MediCard's traffic
# is a fraction and cadence changelog isn't the driver here. Start at 8Gi
# PVC + 512Mi mem req; bump if OOM or if PVC fills once cadence enables.
valkey:
  enabled: true

  global:
    security:
      allowInsecureImages: true

  auth:
    existingSecret: valkey

  architecture: standalone

  image:
    repository: bitnamilegacy/valkey
    tag: 8.0.1-debian-12-r2

  master:
    persistence:
      enabled: true
      storageClass: ""
      size: 8Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

# ===== STORAGE: MinIO Object Storage (Bitnami subchart) =====
# Disabled in prod — s3proxy (below) replaces it. Hapihub is pointed at
# s3proxy via hapihub.minio.serviceName / secretName above.
minio:
  enabled: false

# ===== STORAGE: s3proxy → native Azure Blob =====
# Stateless S3→Blob translator (jclouds azureblob). Presents an S3 API on
# port 9000 as a Service named `s3proxy`. All bytes live in native Azure
# Blob per the Infrastructure Clarifications sheet (row 5.c.xii).
s3proxy:
  enabled: true

  # HA: 2 replicas. s3proxy is a pure jclouds pass-through — no local
  # state — so a second pod behind the Service is safe.
  replicaCount: 2

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - s3proxy
            topologyKey: kubernetes.io/hostname

  externalSecrets:
    enabled: true
    secretStore: azure-secretstore
    secretStoreKind: ClusterSecretStore
    azureAccountKey: medicard-prod-azureblob-account-name
    azureBlobKeyKey: medicard-prod-azureblob-account-key

  container: blobmpseapmycurex01

  gateway:
    enabled: true
    hostname: "storage-mycurex.medicardphils.com"
    listener: http  # External gateway terminates TLS

# ===== EMAIL TESTING: Mailpit =====
mailpit:
  enabled: false  # No mailpit in prod

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

  gateway:
    enabled: false  # Internal only - no external access
    hostname: ""

# ===== MIGRATION: hapihub-migrator (MongoDB → PostgreSQL) =====
hapihubMigrator:
  enabled: true

  image:
    repository: ghcr.io/mycurelabs/hapihub-migrator
    # Pinned to a released, audited tag (AUDIT B1: deployed tag must match a
    # reviewed tree). Bump only via the migrator release process.
    tag: "3.11.0"
    pullPolicy: IfNotPresent

  nodeSelector:
    kubernetes.io/arch: amd64

  gateway:
    enabled: false

  # ── Dashboard: long-lived read-only monitoring UI (its own Deployment) ──
  # Light footprint; probes ON (the migrator's Deployment only ever existed to
  # serve this dashboard — AUDIT B2).
  dashboard:
    enabled: true
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true

  # ── Migration: SUSPENDED CronJob; operators trigger a run via
  #    `kubectl create job --from=cronjob/<release>-hapihub-migrator`.
  #    Runs to completion and exits (no EXIT_ON_BULK_END loop — AUDIT B2). ──
  migrationJob:
    enabled: true
    suspend: true
    backoffLimit: 0        # a failed migration must not silently retry (AUDIT)
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 32Gi       # revisit once GridFS/toArray memory is bounded (Batch F)

  migration:
    mode: "bulk"
    batchSize: "500"
    collectionConcurrency: "1"
    resume: "true"         # resume the latest in-progress run
    existingSecret: "hapihub-migration-secrets"
    # runId: "run-medicard-converge-1"   # pin for a deterministic converging run
    # bulkCutoffDate: "2026-07-16T00:00:00.000Z"  # pin so it doesn't drift to boot time
    # No _cd start filter — migrate the full history. Source is the MongoDB
    # Atlas cluster mycure-stg-sh (real BSON ObjectIds/dates); the run relies on
    # the _cd<=cutoff window + _sl-derived updated_at guard, not a start-date.

  postgresql:
    uriSecret:
      name: "hapihub-migration-secrets"
      key: "pg-target-uri"

  # Syncs `hapihub-migration-secrets` from Azure KV via the prod
  # ClusterSecretStore. All eight KV entries confirmed present in
  # kv-mpi-sea-p-mycurex01 (2026-07-07 bootstrap + 2026-07-10 revalidation).
  # secretKey = key inside the k8s Secret (matches the Deployment's
  # secretKeyRef keys); remoteKey = Azure KV entry name.
  externalSecrets:
    enabled: true
    secretStore: azure-secretstore
    secretStoreKind: ClusterSecretStore
    refreshInterval: 1h
    secrets:
      - secretKey: mongo-source-uri
        remoteKey: medicard-prod-mongo-source-uri
      - secretKey: pg-target-uri
        remoteKey: medicard-prod-pg-target-uri
      # NOTE: pg-encryption-key intentionally removed — the migrator never reads
      # it (AUDIT CRYPTO-1). Injecting it falsely implied PG PII was encrypted
      # at rest. Decrypted PII is written to PG as PLAINTEXT; see the migrator
      # README "Encryption" section. Re-encryption is a separate security project.
      - secretKey: enc-personal-details
        remoteKey: medicard-prod-enc-personal-details
      - secretKey: enc-medical-records
        remoteKey: medicard-prod-enc-medical-records
      - secretKey: enc-billing-invoices
        remoteKey: medicard-prod-enc-billing-invoices
      - secretKey: enc-billing-items
        remoteKey: medicard-prod-enc-billing-items
      - secretKey: enc-billing-payments
        remoteKey: medicard-prod-enc-billing-payments

# ===== BACKUP =====
backup:
  enabled: false

# ===== SECURITY =====
podSecurityStandards:
  enabled: true
  level: restricted

# ===== RESOURCE QUOTAS =====
resourceQuotas:
  enabled: false
