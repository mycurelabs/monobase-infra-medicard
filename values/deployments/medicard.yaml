# MediCard PROD Configuration
# Production environment on Azure AKS (aks-mpi-sea-p-mycurex01)
# Domain: *-mycurex.medicardphils.com
# KV: kv-mpi-sea-p-mycurex01
# PG target: mpiazeppgdb0003.postgres.database.azure.com (user mycure_prod_app)
# Mongo source: mycure-stg-sh.q4trx.mongodb.net (db medicard-production)

global:
  domain: medicardphils.com
  namespace: medicard-prod
  environment: production

# ===== DISABLED: Monobase API (using HapiHub instead) =====
api:
  enabled: false

# ===== DISABLED: Monobase Account Frontend =====
account:
  enabled: false

# ===== DISABLED: Patient Frontend =====
patient:
  enabled: false

# ===== DISABLED: Provider Frontend =====
provider:
  enabled: false

# ===== DISABLED: Website Frontend =====
website:
  enabled: false

# ===== DISABLED: MyCure V8 (Legacy) =====
mycurev8:
  enabled: false

# ===== DISABLED: DentaLemon =====
dentalemon:
  enabled: false

# ===== HEALTHCARE: HapiHub API =====
hapihub:
  enabled: true

  image:
    repository: ghcr.io/mycurelabs/hapihub
    tag: "11.20.47"
    pullPolicy: IfNotPresent

  replicaCount: 1

  nodeSelector:
    kubernetes.io/arch: amd64

  resources:
    requests:
      cpu: 1000m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 2Gi

  gateway:
    hostnames:
      - "api-mycurex.medicardphils.com"
    sectionName: http  # External gateway handles TLS
    snippetsPolicy:
      enabled: false

  config:
    CLUSTER_INSTANCES: "1"
    BETTER_AUTH_RATE_LIMIT_ENABLED: "true"
    BETTER_AUTH_RATE_LIMIT_WINDOW: "60"
    BETTER_AUTH_RATE_LIMIT_MAX: "300"
    BETTER_AUTH_SESSION_COOKIE_CACHE_ENABLED: "false"
    CORS_ORIGINS: "https://cms-mycurex.medicardphils.com"

  livenessProbe:
    enabled: true

  readinessProbe:
    enabled: true

  podDisruptionBudget:
    enabled: false

  autoscaling:
    enabled: false

  externalSecrets:
    enabled: true  # Enables secret mounting in deployment; ESO resource skipped (secrets: [])
    secretStore: azure-secretstore
    secretStoreKind: ClusterSecretStore
    refreshInterval: 1h
    secrets: []

  # v11: PostgreSQL-only (external Azure PG)
  postgresql:
    enabled: true
    external: true  # DATABASE_URI from hapihub-secrets

  mongodb:
    enabled: false  # v11 is PG-only

  minio:
    enabled: true
    defaultBuckets: "monobase-files"

  valkey:
    enabled: false

  mailpit:
    enabled: false  # No mailpit in prod

# ===== HEALTHCARE: MyCure Frontend =====
mycure:
  enabled: true

  image:
    repository: ghcr.io/mycurelabs/mycureapp
    tag: "10.25.68"
    pullPolicy: IfNotPresent

  replicaCount: 1

  nodeSelector:
    kubernetes.io/arch: amd64

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  gateway:
    hostname: "cms-mycurex.medicardphils.com"
    listener: http  # External gateway handles TLS

  config:
    API_URL: "https://api-mycurex.medicardphils.com"
    HAPIHUB_URL: "https://api-mycurex.medicardphils.com"

  podDisruptionBudget:
    enabled: false

# ===== HEALTHCARE: Cadence Real-time Sync (WebSocket) =====
# Disabled: matching preprod 2026-04-07 incident decision
cadence:
  enabled: false

  image:
    repository: ghcr.io/mycurelabs/syncd
    tag: "5.130.24"
    pullPolicy: IfNotPresent

  replicaCount: 1

  nodeSelector:
    kubernetes.io/arch: amd64

  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: "2"
      memory: 4Gi

  gateway:
    hostname: "sync-mycurex.medicardphils.com"
    listener: http  # External gateway handles TLS

  livenessProbe:
    enabled: true

  readinessProbe:
    enabled: true

  podDisruptionBudget:
    enabled: false

  autoscaling:
    enabled: false

  externalSecrets:
    enabled: false

  mongodb:
    serviceName: mongodb
    database: hapihub
    username: root

# ===== DATABASE: PostgreSQL =====
# Disabled: hapihub 11.x connects to external Azure PG
postgresql:
  enabled: false

  # External Secrets configuration
  externalSecrets:
    enabled: true
    secretStore: azure-secretstore
    remoteKey: medicard-staging-postgresql-password
    generator:
      generate: true
      type: password
      description: PostgreSQL admin password

  # Bitnami PostgreSQL subchart configuration
  postgresql:
    fullnameOverride: "postgresql"
    architecture: standalone

    image:
      repository: bitnamilegacy/postgresql
      tag: 16.4.0-debian-12-r13

    auth:
      enabled: true
      existingSecret: postgresql
      secretKeys:
        adminPasswordKey: postgres-password
      database: postgres
      username: postgres

    persistence:
      enabled: true
      storageClass: ""
      size: 20Gi

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 1Gi

    podDisruptionBudget:
      enabled: false

# ===== DATABASE: MongoDB (FerretDB with PostgreSQL backend) =====
# Disabled: hapihub 11.x is PG-only
mongodb:
  enabled: false

  image:
    repository: ghcr.io/ferretdb/ferretdb
    tag: "2.7.0"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  postgresql:
    image:
      repository: ghcr.io/ferretdb/postgres-documentdb
      tag: "17-0.107.0-ferretdb-2.7.0"
      pullPolicy: IfNotPresent

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

    persistence:
      enabled: true
      storageClass: ""
      size: 20Gi

  auth:
    username: "root"
    database: "postgres"
    existingSecret: "mongodb"

  externalSecrets:
    enabled: true
    secretStore: azure-secretstore
    refreshInterval: 1h
    passwordKey: medicard-staging-mongodb-root-password

  networkPolicy:
    enabled: true

# ===== CACHE: Valkey (Redis) =====
valkey:
  enabled: false

# ===== STORAGE: MinIO Object Storage =====
minio:
  enabled: true

  # External Secrets configuration
  externalSecrets:
    enabled: true
    secretStore: azure-secretstore
    secrets:
      - remoteKey: medicard-prod-minio-root-password
        generator:
          generate: true
          type: password
          description: MinIO root password

  # Bitnami MinIO subchart configuration
  minio:
    fullnameOverride: "minio"

    image:
      repository: bitnamilegacy/minio
      tag: "2025.7.23-debian-12-r3"

    mode: standalone

    statefulset:
      replicaCount: 1

    auth:
      existingSecret: minio

    persistence:
      enabled: true
      storageClass: ""
      size: 10Gi

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    defaultBuckets: "monobase-files"

    buckets:
      - name: "monobase-files"
    region: "us-east-1"

    podSecurityContext:
      enabled: true
      fsGroup: 1001
      fsGroupChangePolicy: "OnRootMismatch"

    containerSecurityContext:
      enabled: true
      runAsUser: 1001
      runAsGroup: 1001
      runAsNonRoot: true
      privileged: false
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

    gateway:
      enabled: true
      hostname: "storage-mycurex.medicardphils.com"
      listener: http  # External gateway handles TLS
      rateLimit:
        enabled: false

# ===== EMAIL TESTING: Mailpit =====
mailpit:
  enabled: false  # No mailpit in prod

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

  gateway:
    enabled: false  # Internal only - no external access
    hostname: ""

# ===== MIGRATION: hapihub-migrator (MongoDB → PostgreSQL) =====
hapihubMigrator:
  enabled: true

  image:
    repository: ghcr.io/mycurelabs/hapihub-migrator
    tag: "3.9.3"
    pullPolicy: IfNotPresent

  replicaCount: 0

  nodeSelector:
    kubernetes.io/arch: amd64

  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 32Gi

  gateway:
    enabled: false

  livenessProbe:
    enabled: false

  readinessProbe:
    enabled: false

  migration:
    mode: "bulk"
    batchSize: "500"
    collectionConcurrency: "1"
    exitOnBulkEnd: "true"
    existingSecret: "hapihub-migration-secrets"
    # migrationTimestamp disabled — FerretDB stores _id as strings and timestamps
    # as numbers, so none of the timestamp strategies work. Migrate all data.
    # migrationTimestamp: "2026-03-08T00:00:00.000Z"
    # timestampStrategy: "objectid_only"

  postgresql:
    uriSecret:
      name: "hapihub-migration-secrets"
      key: "pg-target-uri"

# ===== BACKUP =====
backup:
  enabled: false

# ===== SECURITY =====
podSecurityStandards:
  enabled: true
  level: restricted

# ===== RESOURCE QUOTAS =====
resourceQuotas:
  enabled: false
